/* =========================================================
   Produtos (relatório "Análise detalhada de produtos por venda")
   ========================================================= */
let prodState = { cat: "", grp: "", sub: "", sort: "v", q: "", pieMetric: "v" };
const PIE_COLORS = ["#4A0E17", "#B8606E", "#D4AF37", "#0E7490", "#57534E", "#8A2B3A", "#65A30D", "#E7C9CE", "#78350F", "#A8A29E", "#7C3AED", "#F59E0B"];
function inPath(r) { return (!prodState.cat || r.cat === prodState.cat) && (!prodState.grp || r.grp === prodState.grp) && (!prodState.sub || r.sub === prodState.sub); }
function setPath(c, g = "", sg = "") { prodState.cat = c; prodState.grp = g; prodState.sub = sg; renderProducts(); }

function donutSvg(slices, total, centerTop, centerBottom) {
  const R = 90, r = 56, C = 100;
  let a0 = -Math.PI / 2;
  const paths = slices.map((sl, i) => {
    const frac = total ? sl.val / total : 0;
    if (frac <= 0) return "";
    const a1 = a0 + frac * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
    const d = frac >= 0.9999
      ? `M${C},${C - R} A${R},${R} 0 1 1 ${C - 0.01},${C - R} L${C - 0.01},${C - r} A${r},${r} 0 1 0 ${C},${C - r} Z`
      : `M${p(a0, R)} A${R},${R} 0 ${large} 1 ${p(a1, R)} L${p(a1, r)} A${r},${r} 0 ${large} 0 ${p(a0, r)} Z`;
    a0 = a1;
    return `<path d="${d}" fill="${sl.color}" stroke="#fff" stroke-width="1.5" class="${sl.drill ? "cursor-pointer hover:opacity-80" : ""}" ${sl.drill ? `onclick="${sl.drill}"` : ""}><title>${esc(sl.label)}: ${pct(frac, 1)}</title></path>`;
  }).join("");
  return `<svg viewBox="0 0 200 200" class="w-full max-w-[260px] h-auto mx-auto" role="img" aria-label="Participação nas vendas">
    ${paths}
    <text x="100" y="96" text-anchor="middle" font-size="15" font-weight="800" fill="#1C1917">${esc(centerTop)}</text>
    <text x="100" y="114" text-anchor="middle" font-size="9" fill="#78716c">${esc(centerBottom)}</text>
  </svg>`;
}

function pieSection(rows) {
  const m = prodState.pieMetric;
  const val = r => m === "q" ? r.q : r.v;
  const scoped = rows.filter(inPath);
  const total = scoped.reduce((n, r) => n + val(r), 0);
  let level, buckets = {};
  if (!prodState.cat) { level = "categoria"; scoped.forEach(r => { (buckets[r.cat] ||= { key: r.cat, label: catName(r.cat), val: 0, n: 0 }); buckets[r.cat].val += val(r); buckets[r.cat].n++; }); }
  else if (!prodState.grp) { level = "grupo"; scoped.forEach(r => { const k = r.grp || "_"; (buckets[k] ||= { key: r.grp, label: r.grp ? groupName(r.grp) : "Sem grupo", val: 0, n: 0 }); buckets[k].val += val(r); buckets[k].n++; }); }
  else if (!prodState.sub) { level = "subgrupo"; scoped.forEach(r => { const k = r.sub || "_"; (buckets[k] ||= { key: r.sub, label: r.sub ? subName(r.sub) : "Sem subgrupo", val: 0, n: 0 }); buckets[k].val += val(r); buckets[k].n++; }); }
  else { level = "produto"; scoped.forEach(r => { buckets[r.code] = { key: r.code, label: r.name, val: val(r), n: 1, product: true }; }); }
  let list = Object.values(buckets).sort((a, b) => b.val - a.val);
  // No nível de produto, mostra os 9 maiores e agrupa o resto
  if (level === "produto" && list.length > 10) {
    const rest = list.slice(9); list = list.slice(0, 9);
    list.push({ key: null, label: `Demais ${rest.length} produtos`, val: rest.reduce((n, x) => n + x.val, 0), n: rest.length, rest: true });
  }
  list.forEach((b, i) => {
    b.color = b.rest ? "#D6D3D1" : PIE_COLORS[i % PIE_COLORS.length];
    if (level === "categoria") b.drill = `setPath('${b.key}')`;
    else if (level === "grupo" && b.key) b.drill = `setPath('${prodState.cat}', '${b.key}')`;
    else if (level === "subgrupo" && b.key) b.drill = `setPath('${prodState.cat}', '${prodState.grp}', '${b.key}')`;
    else if (b.product) b.drill = `openProductSheet('${b.key}')`;
  });
  const fmt = v => m === "q" ? `${intf(v)} un` : money(v);
  const crumbs = [`<button onclick="setPath('')" class="font-bold ${prodState.cat ? "text-cb-bordo underline" : ""}">Todas</button>`];
  if (prodState.cat) crumbs.push(`<button onclick="setPath('${prodState.cat}')" class="font-bold ${prodState.grp ? "text-cb-bordo underline" : ""}">${esc(catName(prodState.cat))}</button>`);
  if (prodState.grp) crumbs.push(`<button onclick="setPath('${prodState.cat}', '${prodState.grp}')" class="font-bold ${prodState.sub ? "text-cb-bordo underline" : ""}">${esc(groupName(prodState.grp))}</button>`);
  if (prodState.sub) crumbs.push(`<span class="font-bold">${esc(subName(prodState.sub))}</span>`);
  const cat = S.pcats.find(c => c.id === prodState.cat), grp = prodState.grp ? findGroup(prodState.grp)?.g : null;
  const selStyle = "field !h-9 !text-xs";
  return `
    <div class="card p-4 space-y-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div><h2 class="font-extrabold">Participação nas vendas</h2><p class="text-[11px] text-stone-500">Toque em uma fatia para detalhar: categoria › grupo › subgrupo › produtos.</p></div>
        <div class="flex gap-2">
          <div class="seg !p-0.5">${[["v", "Faturamento"], ["q", "Quantidade"]].map(([k, l]) => `<button onclick="prodState.pieMetric='${k}'; renderProducts()" class="seg-btn !h-8 !text-xs ${m === k ? "seg-btn-active" : ""}">${l}</button>`).join("")}</div>
          <button onclick="openCatManager()" class="btn-secondary btn-sm">${icon("tag", "w-4 h-4")} ${isBoard() ? "Editar" : "Ver"} categorias</button>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <select onchange="setPath(this.value)" class="${selStyle}" aria-label="Categoria"><option value="">Todas as categorias</option>${S.pcats.map(c => `<option value="${c.id}" ${c.id === prodState.cat ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        <select onchange="setPath(prodState.cat, this.value)" ${cat ? "" : "disabled"} class="${selStyle} disabled:bg-stone-50" aria-label="Grupo"><option value="">${cat ? "Todos os grupos" : "Grupo"}</option>${(cat?.groups || []).map(g => `<option value="${g.id}" ${g.id === prodState.grp ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select>
        <select onchange="setPath(prodState.cat, prodState.grp, this.value)" ${grp && grp.subs?.length ? "" : "disabled"} class="${selStyle} disabled:bg-stone-50" aria-label="Subgrupo"><option value="">${grp ? "Todos os subgrupos" : "Subgrupo"}</option>${(grp?.subs || []).map(x => `<option value="${x.id}" ${x.id === prodState.sub ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      </div>
      <p class="text-xs text-stone-600 flex items-center gap-1.5 flex-wrap">${crumbs.join(`<span class="text-stone-300">›</span>`)}</p>
      ${total ? `
      <div class="grid md:grid-cols-[260px_1fr] gap-4 items-center">
        ${donutSvg(list, total, fmt(total).replace("R$ ", "R$ "), `${scoped.length} produto(s)`)}
        <div class="divide-y divide-cb-line">
          ${list.map(b => `<${b.drill ? "button" : "div"} ${b.drill ? `onclick="${b.drill}"` : ""} class="w-full text-left py-2 flex items-center gap-3 ${b.drill ? "hover:bg-stone-50" : ""}">
            <span class="w-3 h-3 rounded-sm shrink-0" style="background:${b.color}"></span>
            <span class="flex-1 min-w-0"><span class="block text-sm font-semibold truncate">${esc(b.label)}</span>${b.product || b.rest ? "" : `<span class="block text-[11px] text-stone-500">${b.n} produto(s)</span>`}</span>
            <span class="text-right tabular shrink-0"><span class="block text-sm font-extrabold">${pct(b.val / total, 1)}</span><span class="block text-[11px] text-stone-500">${fmt(b.val)}</span></span>
            ${b.drill && !b.product ? icon("chevron-right", "w-4 h-4 text-stone-300 shrink-0") : ""}
          </${b.drill ? "button" : "div"}>`).join("")}
        </div>
      </div>
      ${prodState.cat ? `<p class="text-[11px] text-stone-500">${esc(pathLabel({ c: prodState.cat, g: prodState.grp, s: prodState.sub }))} representa <b>${pct(total / rows.reduce((n, r) => n + val(r), 0), 1)}</b> ${m === "q" ? "da quantidade vendida" : "do faturamento"} total.</p>` : ""}` : `<p class="text-sm text-stone-400 py-6 text-center">Nenhuma venda neste filtro.</p>`}
    </div>`;
}
function productRows(ym, stores = selStores()) {
  const P = S.prod?.[ym]; if (!P) return null;
  const agg = {};
  stores.forEach(st => Object.entries(P.stores[st] || {}).forEach(([code, [name, q, b, d, v]]) => {
    const a = agg[code] ||= { code, name, q: 0, b: 0, d: 0, v: 0, ...(() => { const p = productPath(code, name); return { cat: p.c, grp: p.g, sub: p.s }; })() };
    a.q += q; a.b += b; a.d += d; a.v += v;
  }));
  const rows = Object.values(agg).sort((a, b) => b.v - a.v);
  const total = rows.reduce((n, r) => n + r.v, 0);
  let acc = 0;
  rows.forEach(r => { acc += r.v; r.abc = acc / total <= 0.8 ? "A" : acc / total <= 0.95 ? "B" : "C"; });
  return { rows, total, P };
}

/* =========================================================
   Análise de combinação (produto base x complemento) e metas
   ========================================================= */
let combo = { base: [], comp: [], metric: "q", editing: null };
const comboQ = { base: "", comp: "" };

function groupTotals(ym, store, codes) {
  const m = S.prod?.[ym]?.stores?.[store] || {};
  let q = 0, v = 0;
  codes.forEach(c => { if (m[c]) { q += m[c][1]; v += m[c][4]; } });
  return { q, v };
}
function comboRate(ym, stores, base, comp, metric) {
  let b = 0, c = 0;
  stores.forEach(st => { const x = groupTotals(ym, st, base), y = groupTotals(ym, st, comp); b += metric === "v" ? x.v : x.q; c += metric === "v" ? y.v : y.q; });
  return { b, c, r: b ? c / b : null };
}
function comboTarget(cb, store) { return cb.targets?.[store] ?? cb.target; }
function rateLabel(r) { return r === null || r === undefined ? "—" : pct(r, 1); }
function metricText(metric) { return metric === "v" ? "valor do complemento em % do valor da base" : "quantidade do complemento em % da quantidade da base"; }

// Conta reversa: quanto vender a mais por dia para o índice chegar à meta, mantendo o volume da base.
function periodDays(ym) { const P = S.prod?.[ym]; if (!P) return 0; return Math.round((new Date(P.to + "T00:00:00") - new Date(P.from + "T00:00:00")) / 86400000) + 1; }
function comboGap(ym, store, cb) {
  const days = periodDays(ym) || 1;
  const B = groupTotals(ym, store, cb.base), C = groupTotals(ym, store, cb.comp);
  const t = comboTarget(cb, store);
  const baseAmt = cb.metric === "v" ? B.v : B.q, compAmt = cb.metric === "v" ? C.v : C.q;
  const need = t * baseAmt;                    // complemento necessário no período
  const extra = Math.max(0, need - compAmt);   // a mais no período
  const unitPrice = C.q ? C.v / C.q : null;
  return {
    days, t, r: baseAmt ? compAmt / baseAmt : null,
    baseDay: baseAmt / days, compDay: compAmt / days, needDay: need / days,
    extraDay: extra / days,
    extraMoneyDay: cb.metric === "v" ? extra / days : unitPrice ? extra / days * unitPrice : null,
    unitPrice
  };
}
function gapLine(g, cb) {
  if (g.r === null) return `<p class="text-[11px] text-stone-400 mt-1">Sem venda da base no período.</p>`;
  if (g.extraDay <= 0) return `<p class="text-[11px] text-emerald-700 font-semibold mt-1">Meta atingida. Manter ${cb.metric === "v" ? money(g.compDay) : `${fmtDay(g.compDay)} complemento(s)`} por dia.</p>`;
  return cb.metric === "v"
    ? `<p class="text-[11px] text-stone-700 mt-1">Vender <b>+${money2(g.extraDay)} por dia</b> em complementos (de ${money(g.compDay)} para ${money(g.needDay)} por dia).</p>`
    : `<p class="text-[11px] text-stone-700 mt-1">Vender <b>+${fmtDay(g.extraDay)} complemento(s) por dia</b>${g.extraDay < 3 ? ` (≈ ${Math.ceil(g.extraDay * 7)} por semana)` : ""}, de ${fmtDay(g.compDay)} para ${fmtDay(g.needDay)} por dia${g.extraMoneyDay ? `, cerca de <b>+${money2(g.extraMoneyDay)}</b> por dia` : ""}.</p>`;
}
function fmtDay(x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: x < 10 ? 1 : 0 }); }
function productName(code) {
  for (const ym of Object.keys(S.prod || {})) for (const m of Object.values(S.prod[ym].stores)) if (m[code]) return m[code][0];
  return code;
}

function comboBar(r, target, max) {
  const w = r === null ? 0 : Math.min(100, r / max * 100);
  const ok = target != null && r !== null && r >= target;
  return `<div class="goalbar"><div class="fill" style="width:${w}%;background:${target == null ? "#4A0E17" : ok ? "#059669" : "#F59E0B"}"></div>
    ${target != null ? `<div class="tick" style="left:calc(${Math.min(100, target / max * 100)}% - 1px)" title="Meta"></div>` : ""}</div>`;
}

function renderComboPicker(side) {
  const ym = S.view.month;
  const box = document.getElementById(`combo-res-${side}`);
  if (!box) return;
  const q = comboQ[side].trim().toUpperCase();
  const R = productRows(ym, visibleStores());
  if (!q) { box.innerHTML = ""; return; }
  const chosen = new Set([...combo.base, ...combo.comp]);
  const hits = R.rows.filter(r => !chosen.has(r.code) && (r.name.toUpperCase().includes(q) || r.code.includes(q))).slice(0, 8);
  box.innerHTML = hits.map(r => `<button onclick="comboAdd('${side}', '${r.code}')" class="w-full text-left px-3 py-2 flex items-center gap-2 hover:bg-cb-soft">
      <span class="text-cb-bordo">${icon("up", "w-3.5 h-3.5 rotate-45")}</span><span class="flex-1 text-sm truncate">${esc(r.name)}</span><span class="text-[11px] text-stone-500 tabular">${intf(r.q)} un</span></button>`).join("")
    || `<p class="px-3 py-2 text-xs text-stone-400">Nenhum produto encontrado.</p>`;
}
function comboAdd(side, code) { if (!combo[side].includes(code)) combo[side].push(code); comboQ[side] = ""; renderProducts(); document.getElementById(`combo-q-${side}`)?.focus(); }
function comboRemove(side, code) { combo[side] = combo[side].filter(c => c !== code); renderProducts(); }
function comboAddCat(side, key) {
  if (!key) return;
  const [kind, id] = key.includes(":") ? key.split(":") : ["c", key];
  const R = productRows(S.view.month, visibleStores());
  R.rows.filter(r => (kind === "c" ? r.cat : kind === "g" ? r.grp : r.sub) === id && !combo.base.includes(r.code) && !combo.comp.includes(r.code)).forEach(r => combo[side].push(r.code));
  renderProducts();
}
function comboSwap() { [combo.base, combo.comp] = [combo.comp, combo.base]; renderProducts(); }
function comboClear() { combo = { base: [], comp: [], metric: combo.metric, editing: null }; renderProducts(); }
function comboLoad(id) {
  const cb = S.combos.find(x => x.id === id); if (!cb) return;
  combo = { base: [...cb.base], comp: [...cb.comp], metric: cb.metric, editing: id };
  S.view.tab = "products"; render();
  document.getElementById("combo-card")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function comboPanel(side, title, hint) {
  const ym = S.view.month;
  const codes = combo[side];
  const tot = visibleStores().reduce((a, st) => { const t = groupTotals(ym, st, codes); a.q += t.q; a.v += t.v; return a; }, { q: 0, v: 0 });
  const R = productRows(ym, visibleStores());
  const cats = [...new Set(R.rows.map(r => r.cat))];
  return `<div class="rounded-2xl border border-cb-line p-3 space-y-2.5 ${side === "base" ? "bg-white" : "bg-cb-cream/60"}">

      <option value="">+ Adicionar categoria, grupo ou subgrupo inteiro</option>${S.pcats.filter(c => cats.includes(c.id)).map(c => `<option value="c:${c.id}">${esc(c.name)}</option>` +
        (c.groups || []).map(g => `<option value="g:${g.id}">  ${esc(c.name)} › ${esc(g.name)}</option>` + (g.subs || []).map(x => `<option value="s:${x.id}">    ${esc(g.name)} › ${esc(x.name)}</option>`).join("")).join("")).join("")}
    </select>
    <div class="flex flex-wrap gap-1.5 min-h-[36px]">
      ${codes.map(c => `<span class="inline-flex items-center gap-1 pl-2.5 pr-1 h-8 rounded-full bg-white border border-stone-200 text-xs font-semibold max-w-full">
        <span class="truncate">${esc(productName(c))}</span>
        <button onclick="comboRemove('${side}', '${c}')" class="w-6 h-6 rounded-full hover:bg-stone-100 flex items-center justify-center shrink-0" aria-label="Remover">${icon("x", "w-3.5 h-3.5")}</button></span>`).join("")

}

function comboSection(ym) {

    result = `
      <div class="rounded-2xl bg-cb-bordo text-white p-4 flex items-end justify-between gap-4 flex-wrap">
        <div><p class="text-xs font-bold uppercase tracking-wider opacity-80">${stores.length > 1 ? "Rede" : esc(shortStore(stores[0]))}</p>

          <p class="text-sm opacity-90">${metricText(combo.metric)}</p></div>
        <p class="text-xs opacity-80 tabular text-right">${combo.metric === "v" ? `${money(all.c)} de ${money(all.b)}` : `${intf(all.c)} complementos em ${intf(all.b)} itens base`}</p>
      </div>
      ${stores.length > 1 ? `<div class="space-y-3">
        ${per.sort((a, b) => (b.r || 0) - (a.r || 0)).map(x => `<div>
          <div class="flex items-baseline justify-between gap-3 mb-1"><span class="text-sm font-semibold">${esc(shortStore(x.st))}</span>
          <span class="text-sm tabular"><b>${rateLabel(x.r)}</b>${x.target != null ? ` <span class="text-[11px] text-stone-500">meta ${rateLabel(x.target)}</span>` : ""} <span class="text-[11px] text-stone-400">(${combo.metric === "v" ? money(x.c) : `${intf(x.c)} de ${intf(x.b)}`})</span></span></div>

  return `
    <div id="combo-card" class="card p-4 space-y-4">
      <div class="flex items-start justify-between gap-2 flex-wrap">
        <div><h2 class="font-extrabold">Análise de combinação</h2>
        <p class="text-[11px] text-stone-500">Escolha os produtos base (ex.: chocolates) e os complementos (ex.: chantilly) para ver quanto do complemento sai junto, loja por loja.</p></div>
        <div class="flex gap-2">
          <div class="seg !p-0.5">${[["q", "Quantidade"], ["v", "Valor"]].map(([k, l]) => `<button onclick="combo.metric='${k}'; renderProducts()" class="seg-btn !h-8 !text-xs ${combo.metric === k ? "seg-btn-active" : ""}">${l}</button>`).join("")}</div>
        </div>
      </div>
      ${editing ? `<div class="rounded-xl bg-sky-50 text-sky-900 text-xs font-semibold px-3 py-2 flex items-center justify-between gap-2">Editando: ${esc(editing.name)} <button onclick="comboClear()" class="underline">sair</button></div>` : ""}
      <div class="grid md:grid-cols-2 gap-3 items-start">
        ${comboPanel("base", "1. Produto base", "o que o cliente compra")}
        ${comboPanel("comp", "2. Complemento", "o que queremos vender junto")}
      </div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="comboSwap()" class="btn-secondary btn-sm">Inverter</button>
        <button onclick="comboClear()" class="btn-secondary btn-sm">Limpar</button>
        ${ready && isBoard() ? `<button onclick="openComboSave()" class="btn-primary btn-sm ml-auto">${icon("target", "w-4 h-4")} ${editing ? "Atualizar combinação e meta" : "Salvar como meta de combinação"}</button>` : ""}
      </div>
      ${result}
      ${ready ? `<p class="text-[11px] text-stone-500">O relatório traz o total vendido de cada produto no período, sem ligar os itens ao mesmo cupom. O índice compara o volume do complemento com o da base.</p>` : ""}
    </div>
    ${trackedCombos(ym)}`;
}

function trackedCombos(ym, compact = false) {
  const list = S.combos || [];
  if (!list.length) return compact ? "" : `<div class="card p-4 text-sm text-stone-500">Nenhuma combinação acompanhada ainda. ${isBoard() ? "Monte uma análise acima e salve com uma meta." : ""}</div>`;
  const stores = compact ? selStores() : visibleStores();
  return `
    <div class="space-y-2.5">
      <div class="flex items-center justify-between"><h2 class="text-[17px] font-extrabold tracking-tight">Metas de combinação</h2>${compact ? `<button onclick="go('products')" class="text-xs font-bold text-cb-bordo">Ver em Produtos</button>` : ""}</div>
      <div class="grid ${compact ? "" : "lg:grid-cols-2"} gap-3">
      ${list.map(cb => {
        const per = stores.map(st => ({ st, ...comboRate(ym, [st], cb.base, cb.comp, cb.metric), t: comboTarget(cb, st) }));
        const max = Math.max(0.0001, ...per.map(x => Math.max(x.r || 0, x.t || 0))) * 1.1;
        const hit = per.filter(x => x.r !== null && x.r >= x.t).length;
        return `<div class="card p-4 space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0"><p class="font-extrabold">${esc(cb.name)}</p>
            <p class="text-[11px] text-stone-500">${cb.base.length} produto(s) base, ${cb.comp.length} complemento(s). ${metricText(cb.metric)}.</p></div>
            ${stores.length > 1 ? `<span class="chip ${hit === stores.length ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-900"} shrink-0">${hit}/${stores.length} na meta</span>` : ""}
          </div>
          ${cb.note ? `<p class="text-xs rounded-lg bg-cb-cream px-3 py-2">${esc(cb.note)}</p>` : ""}
          <div class="space-y-3">${per.map(x => `<div>
            <div class="flex items-baseline justify-between gap-3 mb-1"><span class="text-sm font-semibold truncate">${esc(shortStore(x.st))}</span>
            <span class="text-sm tabular shrink-0"><b class="${x.r !== null && x.r >= x.t ? "text-emerald-700" : ""}">${rateLabel(x.r)}</b> <span class="text-[11px] text-stone-500">/ meta ${rateLabel(x.t)}</span></span></div>
            ${comboBar(x.r, x.t, max)}
            ${gapLine(comboGap(ym, x.st, cb), cb)}
          </div>`).join("")}</div>
          ${stores.length > 1 ? (() => { const tot = stores.reduce((a, st) => { const g = comboGap(ym, st, cb); a.u += g.extraDay; a.m += g.extraMoneyDay || 0; return a; }, { u: 0, m: 0 }); return tot.u > 0 ? `<p class="text-xs rounded-lg bg-cb-bg px-3 py-2">Rede: <b>${cb.metric === "v" ? `+${money(tot.m)}` : `+${fmtDay(tot.u)} complementos, ≈ +${money(tot.m)}`}</b> por dia se todas as lojas chegarem à meta.</p>` : ""; })() : ""}
          <p class="text-[11px] text-stone-500">${cb.growth ? `Meta definida como crescimento de ${pct(cb.growth)} sobre o índice de cada loja. ` : ""}Conta feita com a média diária de ${periodDays(ym)} dia(s) do relatório, mantendo a venda atual da base.</p>
          <div class="flex gap-2">
            <button onclick="comboLoad('${cb.id}')" class="btn-secondary btn-sm">${isBoard() ? "Abrir e editar" : "Ver produtos"}</button>
            ${isBoard() ? `<button onclick="deleteCombo('${cb.id}')" class="btn-secondary btn-sm !text-rose-700 ml-auto">Excluir</button>` : ""}
          </div>
        </div>`;
      }).join("")}
      </div>
    </div>`;
}

let comboMode = "index";
function openComboSave() {
  const ym = S.view.month;
  const ed = combo.editing ? S.combos.find(x => x.id === combo.editing) : null;
  comboMode = ed?.growth ? "growth" : "index";

  const toIn = r => r == null ? "" : +(r * 100).toFixed(1);
  openSheet(`${sheetHeader(ed ? "Atualizar meta de combinação" : "Salvar meta de combinação", `Índice atual da rede: ${rateLabel(all.r)}`)}
    <div class="overflow-y-auto px-5 py-4 space-y-4">
      <div><label for="cb-name" class="label">Nome da combinação</label>
        <input id="cb-name" class="field" value="${esc(ed?.name || "")}" placeholder="Ex.: Chantilly nos chocolates"></div>
      <div class="seg">
        <button id="cbm-index" onclick="setComboMode('index')" class="seg-btn">Atingir um índice</button>
        <button id="cbm-growth" onclick="setComboMode('growth')" class="seg-btn">Crescer sobre o atual</button>
      </div>
      <div class="flex items-end gap-3 flex-wrap">
        <div><label for="cb-target" id="cb-target-label" class="label"></label>
          <div class="relative w-36"><input id="cb-target" type="number" step="0.5" min="0" oninput="previewComboTargets()" class="field text-right font-bold pr-8" value="${ed ? (ed.growth ? toIn(ed.growth) : toIn(ed.target)) : ""}" placeholder="Ex.: 10"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-stone-400">%</span></div></div>
        <p id="cb-mode-help" class="text-[11px] text-stone-500 flex-1 min-w-[180px]"></p>
      </div>
      <div class="space-y-2">
        <p class="label !mb-0">Meta de cada loja</p>
        ${STORES.map((st, i) => `<div class="flex items-center gap-3 text-sm">
          <span class="flex-1 truncate">${esc(shortStore(st))} <span class="text-[11px] text-stone-500">hoje ${rateLabel(cur[i])}</span></span>
          <div class="relative w-28"><input id="cb-t-${i}" type="number" step="0.5" min="0" oninput="this.dataset.manual='1'; previewComboTargets()" class="field !h-9 text-right pr-7" value="${ed?.targets?.[st] != null ? toIn(ed.targets[st]) : ""}" placeholder="geral"><span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-stone-400">%</span></div>
          <span id="cb-g-${i}" class="w-40 text-[11px] text-stone-600 text-right"></span></div>`).join("")}
        <p class="text-[11px] text-stone-500">À direita, quanto a loja precisa vender a mais por dia. Você pode ajustar a meta de qualquer loja manualmente.</p>
      </div>
      <div><label for="cb-note" class="label">Orientação para o gerente (opcional)</label>
        <textarea id="cb-note" rows="2" class="field !h-auto py-2" placeholder="Ex.: Oferecer chantilly em todo chocolate quente">${esc(ed?.note || "")}</textarea></div>
    </div>
    <div class="px-5 py-4 border-t border-cb-line flex gap-2 pb-[max(1rem,env(safe-area-inset-bottom))]">
      <button onclick="closeSheet()" class="btn-secondary">Cancelar</button>
      <button onclick="saveCombo()" class="btn-primary flex-1">${ed ? "Atualizar" : "Salvar e acompanhar"}</button>
    </div>`);
  setComboMode(comboMode, true);
}
function setComboMode(m, keep = false) {
  comboMode = m;
  document.getElementById("cbm-index").className = `seg-btn ${m === "index" ? "seg-btn-active" : ""}`;
  document.getElementById("cbm-growth").className = `seg-btn ${m === "growth" ? "seg-btn-active" : ""}`;
  document.getElementById("cb-target-label").innerText = m === "index" ? "Meta de índice para todas as lojas" : "Crescimento sobre o índice atual";
  document.getElementById("cb-mode-help").innerText = m === "index"
    ? "Ex.: 10% = vender 10 complementos a cada 100 itens da base."
    : "Ex.: 20% faz uma loja em 30% ir para 36%. Cada loja parte do próprio índice.";
  if (!keep) STORES.forEach((_, i) => { const el = document.getElementById(`cb-t-${i}`); el.value = ""; delete el.dataset.manual; });
  previewComboTargets();
}
// Meta de cada loja conforme o modo, e a conta reversa ao lado
function comboTargetsFromForm() {
  const ym = S.view.month;
  const g = parseFloat(String(document.getElementById("cb-target").value).replace(",", ".")) / 100;
  return STORES.map((st, i) => {
    const el = document.getElementById(`cb-t-${i}`);
    const manual = parseFloat(String(el.value).replace(",", ".")) / 100;
    const cur = comboRate(ym, [st], combo.base, combo.comp, combo.metric).r;
    let t = null, auto = null;
    if (g > 0) auto = comboMode === "growth" ? (cur ? cur * (1 + g) : null) : g;
    if (el.dataset.manual && manual > 0) t = manual; else t = auto;
    if (comboMode === "growth" && !el.dataset.manual) el.value = auto ? +(auto * 100).toFixed(1) : "";
    return { st, t, auto, manual: !!el.dataset.manual && manual > 0 };
  });
}
function previewComboTargets() {
  const ym = S.view.month;
  comboTargetsFromForm().forEach(({ st, t }, i) => {
    const el = document.getElementById(`cb-g-${i}`);
    if (!t) { el.innerHTML = ""; return; }
    const g = comboGap(ym, st, { base: combo.base, comp: combo.comp, metric: combo.metric, target: t, targets: {} });
    el.innerHTML = g.extraDay <= 0 ? `<span class="text-emerald-700 font-semibold">já atinge</span>`
      : combo.metric === "v" ? `+${money2(g.extraDay)}/dia` : `+${fmtDay(g.extraDay)}/dia${g.extraMoneyDay ? ` (≈${money(g.extraMoneyDay)})` : ""}`;
  });
}
function saveCombo() {
  const name = document.getElementById("cb-name").value.trim();
  const v = parseFloat(String(document.getElementById("cb-target").value).replace(",", ".")) / 100;
  if (!name) return toast("Dê um nome para a combinação.", "warn");
  if (!(v > 0)) return toast(comboMode === "growth" ? "Informe o percentual de crescimento." : "Informe a meta em percentual.", "warn");
  const rows = comboTargetsFromForm();
  const targets = {};
  rows.forEach(r => { if (comboMode === "growth" ? r.t : r.manual) targets[r.st] = r.t; });
  const ym = S.view.month;
  const netCur = comboRate(ym, STORES, combo.base, combo.comp, combo.metric).r || 0;
  const data = { name, base: [...combo.base], comp: [...combo.comp], metric: combo.metric,
    target: comboMode === "growth" ? netCur * (1 + v) : v, growth: comboMode === "growth" ? v : null,
    targets, note: document.getElementById("cb-note").value.trim(), at: Date.now(), by: "Diretoria", baseMonth: ym };
  const ed = combo.editing ? S.combos.find(x => x.id === combo.editing) : null;
  if (ed) Object.assign(ed, data); else S.combos.unshift({ id: "c" + Date.now().toString(36), ...data });
  save(); closeSheet(); combo.editing = null; renderProducts();
  toast(ed ? "Combinação atualizada." : "Combinação salva. Os gerentes já veem a meta e quanto vender a mais por dia.");
}
async function deleteCombo(id) {
  if (!await askConfirm("Excluir esta meta de combinação?")) return;
  S.combos = S.combos.filter(x => x.id !== id); if (combo.editing === id) combo.editing = null;
  save(); renderProducts(); toast("Combinação excluída.", "info");
}

  const ym = S.view.month;
  const box = document.getElementById("view-products");
  const R = productRows(ym);
  if (!R || !R.rows.length) {
    box.innerHTML = `<div><h1 class="text-[26px] font-extrabold tracking-tight">Produtos</h1></div>

    return;
  }
  const { rows, total, P } = R;

  const A = rows.filter(r => r.abc === "A").length;
  const st = monthStats(ym);

  const top = list.slice(0, 40);

  box.innerHTML = `
    <div><h1 class="text-[26px] font-extrabold tracking-tight">Produtos</h1>
    <p class="text-sm text-cb-muted">${isoToBRs(P.from)} a ${isoToBRs(P.to)}, ${S.view.store ? esc(shortStore(S.view.store)) : "todas as lojas"}</p></div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
      <div class="card p-4"><p class="text-xs font-bold text-stone-500">Itens vendidos</p><p class="text-2xl font-extrabold tabular mt-1">${intf(qty)}</p><p class="text-[11px] text-stone-500 mt-0.5">${tc ? `${(qty / tc).toLocaleString("pt-BR", { maximumFractionDigits: 2 })} itens por venda` : ""}</p></div>
      <div class="card p-4"><p class="text-xs font-bold text-stone-500">Preço médio por item</p><p class="text-2xl font-extrabold tabular mt-1">${money2(total / qty)}</p><p class="text-[11px] text-stone-500 mt-0.5">líquido, após descontos</p></div>
      <div class="card p-4"><p class="text-xs font-bold text-stone-500">Produtos vendidos</p><p class="text-2xl font-extrabold tabular mt-1">${rows.length}</p><p class="text-[11px] text-stone-500 mt-0.5"><b>${A}</b> fazem 80% do faturamento</p></div>
      <div class="card p-4"><p class="text-xs font-bold text-stone-500">Descontos em produtos</p><p class="text-2xl font-extrabold tabular mt-1">${money(disc)}</p><p class="text-[11px] text-stone-500 mt-0.5">${pct(disc / gross, 1)} do valor bruto</p></div>
    </div>

    ${comboSection(ym)}

    ${pieSection(rows)}

    ${multi ? `
    <div class="card overflow-hidden">

      <div class="overflow-x-auto">
        <table class="w-full text-sm tabular min-w-[600px]">
          <thead><tr class="text-[11px] uppercase tracking-wide text-stone-500 border-b border-cb-line"><th class="text-left px-4 py-2 font-bold">Categoria</th>${catByStore.map(x => `<th class="text-right px-2 py-2 font-bold">${esc(shortStore(x.s).split(" ")[0])}</th>`).join("")}<th class="text-right px-4 py-2 font-bold">Todas</th></tr></thead>
          <tbody class="divide-y divide-cb-line">
            ${catList.map(([k, c]) => { const all = c.v / total; return `<tr><td class="px-4 py-2 font-semibold">${esc(catName(k))}</td>
              ${catByStore.map(x => { const sh = (x.m[k] || 0) / x.t; const d = sh - all; return `<td class="text-right px-2 py-2 ${d >= 0.03 ? "text-emerald-700 font-bold" : d <= -0.03 ? "text-rose-700 font-bold" : ""}">${pct(sh, 1)}</td>`; }).join("")}

function bulkMove(v) {
  if (!v) return;
  const [c, g, sg] = v.split("|");
  const n = catMgr.sel.size;
  setProductPath([...catMgr.sel], { c, g: g || "", s: sg || "" });
  catMgr.sel = new Set(); renderCatManager();
  toast(`${n} produto(s) movido(s) para ${pathLabel({ c, g, s: sg })}.`);
}
function nodeList(kind, ids) {
  if (kind === "c") return S.pcats;
  const c = S.pcats.find(x => x.id === ids[0]);
  if (kind === "g") return (c.groups ||= []);
  const g = c.groups.find(x => x.id === ids[1]);
  return (g.subs ||= []);
}
function renameNode(kind, ids, v) {
  v = v.trim(); if (!v) { toast("O nome não pode ficar vazio.", "warn"); return renderCatManager(); }
  const list = nodeList(kind, ids.slice(0, kind === "c" ? 0 : kind === "g" ? 1 : 2));
  const node = list.find(x => x.id === ids[ids.length - 1]); node.name = v;
  save(); renderProducts(); toast("Nome atualizado.");
}
function moveNode(kind, ids, i, d) { const list = nodeList(kind, ids); const j = i + d; [list[i], list[j]] = [list[j], list[i]]; save(); renderCatManager(); renderProducts(); }
function addNode(kind, ids) {
  const input = document.getElementById(kind === "c" ? "new-c" : kind === "g" ? `new-g-${ids[0]}` : `new-s-${ids[1]}`);
  const v = input.value.trim(); if (!v) return toast("Digite um nome.", "warn");
  const list = nodeList(kind, ids);
  if (list.some(x => x.name.toLowerCase() === v.toLowerCase())) return toast("Já existe com esse nome.", "warn");
  const node = kind === "c" ? { id: uid2("cat"), name: v, groups: [] } : kind === "g" ? { id: uid2("grp"), name: v, subs: [] } : { id: uid2("sub"), name: v };
  if (kind === "c") list.splice(Math.max(0, list.findIndex(c => c.id === "outros")), 0, node); else list.push(node);
  if (kind !== "c") catMgr.open[ids[ids.length - 1]] = true;
  if (kind === "g") catMgr.open[node.id] = true;
  save(); renderCatManager(); renderProducts();
  toast(kind === "c" ? "Categoria criada." : kind === "g" ? "Grupo criado. Mova os produtos para ele na aba Produtos." : "Subgrupo criado. Mova os produtos para ele na aba Produtos.");
}
async function deleteNode(kind, ids, i) {
  const list = nodeList(kind, ids); const node = list[i];
  const label = { c: "a categoria", g: "o grupo", s: "o subgrupo" }[kind];
  if (!await askConfirm(`Excluir ${label} "${node.name}"?`)) return;
  list.splice(i, 1);
  Object.entries(S.pcatOf || {}).forEach(([code, ov]) => {
    if (kind === "c" && ov.c === node.id) delete S.pcatOf[code];
    if (kind === "g" && ov.g === node.id) S.pcatOf[code] = { c: ov.c, g: "", s: "" };
    if (kind === "s" && ov.s === node.id) S.pcatOf[code] = { c: ov.c, g: ov.g, s: "" };
  });
  if (prodState.cat === node.id || prodState.grp === node.id || prodState.sub === node.id) { prodState.cat = prodState.grp = prodState.sub = ""; }
  save(); renderCatManager(); renderProducts(); toast("Excluído.", "info");
}
async function resetCats() {

const PALETTE = ["#4A0E17", "#8A2B3A", "#B8606E", "#D4AF37", "#A8A29E", "#57534E", "#E7C9CE", "#78350F"];

function shareBlock(title, ic, map, total, opts = {}) {
  const rows = Object.entries(map).map(([k, [v, t]]) => ({ k, v, t })).sort((a, b) => b.v - a.v);
  if (!rows.length) return "";
  return `
    <div class="card p-4 space-y-3">
      <h2 class="font-extrabold flex items-center gap-2">${icon(ic, "w-5 h-5 text-cb-bordo")} ${title}</h2>
      <div class="flex h-3.5 rounded-full overflow-hidden" role="img" aria-label="${esc(title)}">
        ${rows.map((r, i) => `<div style="width:${r.v / total * 100}%;background:${PALETTE[i % PALETTE.length]}" title="${esc(r.k)}: ${pct(r.v / total, 1)}"></div>`).join("")}
      </div>
      <div class="divide-y divide-cb-line">
        ${rows.map((r, i) => `<div class="py-2 flex items-center gap-3 text-sm">
          <span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${PALETTE[i % PALETTE.length]}"></span>

  if (!A.detailed) {
    box.innerHTML = `<div><h1 class="text-[26px] font-extrabold tracking-tight">Análises</h1></div>
      <div class="card p-8 text-center text-sm text-stone-500">Este mês foi importado só com totais por dia. Importe o arquivo de vendas do sistema (…_VND_PERIODO_….txt) para ver horários, pagamentos, clientes, promoções e equipe.</div>`;
    return;
  }
  // horários
  const hours = Array.from({ length: 24 }, (_, h) => ({ h, v: A.h[h]?.[0] || 0, t: A.h[h]?.[1] || 0 }));

          <div class="w-full rounded-t ${peak.includes(x.h) ? "bg-cb-bordo" : "bg-cb-bordo/35"}" style="height:${Math.max(2, x.v / hMax * 100)}%"></div>

function setGoal(ym, i, v) { (S.goals[ym] ||= {})[STORES[i]] = Math.max(0, Math.round(Number(v) || 0)); save(); toast("Meta salva."); renderGoals(); }
function setPlanMonth(ym, i, k, v) { const p = planOf(ym, STORES[i]); p.month[k] = Math.max(0, Number(v) || 0); if (k === "meta") (S.goals[ym] ||= {})[STORES[i]] = p.month.meta; save(); renderGoals(); toast("Meta salva."); }
function setPlanWeek(ym, i, wi, k, v) { planOf(ym, STORES[i]).weeks[wi][k] = Math.max(0, Number(v) || 0); save(); renderGoals(); toast("Meta da semana salva."); }
function setPlanPrize(ym, i, k, v) { planOf(ym, STORES[i]).prizes[k] = Math.max(0, Number(v) || 0); save(); renderGoals(); toast("Prêmio salvo."); }

// Monta semanas (blocos de 7 dias, a última até o fim do mês), níveis (+8% e +16%) e metas diárias pelo peso do dia.
function buildPlan(ym, i) {
  const s = STORES[i];
  const g = S.goals[ym]?.[s] || 0;
  if (!g) return toast("Informe a meta do mês primeiro.", "warn");
  const dim = daysInMonth(ym);
  let wsum = 0; for (let d = 1; d <= dim; d++) wsum += wOf(dateOf(ym, d));
  const days = []; for (let d = 1; d <= dim; d++) days.push(Math.round(g * wOf(dateOf(ym, d)) / wsum / 100) * 100);
  days[dim - 1] += g - days.reduce((a, b) => a + b, 0);
  const ranges = [[1, 7], [8, 14], [15, 21], [22, dim]];
  const weeks = ranges.map(([a, b]) => { const m = days.slice(a - 1, b).reduce((x, y) => x + y, 0); return { from: a, to: b, meta: m, ouro: Math.round(m * 1.08 / 1000) * 1000, diamante: Math.round(m * 1.16 / 1000) * 1000 }; });
  (S.plans[ym] ||= {})[s] = { days, weeks, month: { meta: g, ouro: weeks.reduce((n, w) => n + w.ouro, 0), diamante: weeks.reduce((n, w) => n + w.diamante, 0) }, prizes: { meta: 80, ouro: 100, diamante: 120 } };
  save(); renderGoals(); toast("Semanas, níveis e metas diárias montados. Ajuste o que precisar.");
}

function openDailyGoals(ym, i) {
  const s = STORES[i], p = planOf(ym, s), ro = isBoard() ? "" : "disabled";
  const draw = () => {
    const sum = p.days.reduce((a, b) => a + (b || 0), 0);
    document.getElementById("daily-sum").innerHTML = `Soma das diárias: <b>${money(sum)}</b> ${Math.abs(sum - p.month.meta) > 1 ? `<span class="text-amber-800">(meta do mês ${money(p.month.meta)})</span>` : `<span class="text-emerald-700">confere com a meta do mês</span>`}`;
  };
  openSheet(`${sheetHeader("Metas diárias", `${esc(s)}, ${monthLabel(ym)}`)}
    <div class="overflow-y-auto px-5 py-3">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-2">
        ${p.days.map((v, d) => { const date = dateOf(ym, d + 1); const wd = WD[new Date(date + "T00:00:00").getDay()]; const real = dayTotal(date, [s]);
          return `<label class="flex items-center gap-2 text-sm"><span class="w-12 shrink-0"><b class="tabular">${String(d + 1).padStart(2, "0")}</b> <span class="text-[11px] text-stone-500">${wd}</span></span>
            <input type="number" min="0" step="100" value="${v}" ${ro} onchange="setDailyGoal('${ym}', ${i}, ${d}, this.value)" class="field !h-9 !px-2 text-right tabular disabled:bg-stone-50" aria-label="Meta do dia ${d + 1}">
            ${real ? `<span class="w-3 h-3 rounded-full shrink-0 ${real.v >= v ? "bg-emerald-500" : "bg-rose-400"}" title="Vendido: ${money(real.v)}"></span>` : `<span class="w-3 shrink-0"></span>`}</label>`; }).join("")}
      </div>
      <p id="daily-sum" class="text-sm mt-4"></p>
      <p class="text-[11px] text-stone-500 mt-1">O ponto verde ou vermelho mostra se o dia já vendido bateu a meta diária.</p>
    </div>`);
  draw();

}

/* Leitor do PDF de metas (um PDF por loja e mês, modelo META_<LOJA>_<MM>.<AA>.pdf).
   Recebe as linhas de texto do PDF (itens agrupados pela altura na página). */
function parseGoalPdfLines(lines, fileName = "") {
  const N = s => Number(String(s).replace(/\./g, "").replace(",", "."));
  const MONEY = "([\\d.]+,\\d{2})";
  const res = { file: fileName, store: null, label: null, ym: null, days: {}, weekRanges: [], weeks: [], prizes: {}, monthMeta: null, tiersTotal: null, warnings: [] };
  let weekStart = null, lastDay = null;
  for (const raw of lines) {
    const l = raw.replace(/\s+/g, " ").trim();
    let m;
    if (!res.label && (m = l.match(/^(.+?) META RESULTADO/i))) res.label = m[1].trim();
    if ((m = l.match(new RegExp(`^(\\d{2})/(\\d{2})/(\\d{2,4})(?: [A-ZÁÉ]{3})? ${MONEY}`)))) {
      const y = m[3].length === 2 ? "20" + m[3] : m[3];
      const ym = `${y}-${m[2]}`;
      res.ym ||= ym;
      if (ym !== res.ym) continue;
      const d = Number(m[1]);
      res.days[d] = N(m[4]);
      if (weekStart === null) weekStart = d;
      lastDay = d;
      continue;
    }
    if (/^TOTAL SEMANA \d/i.test(l)) { if (weekStart !== null) res.weekRanges.push({ from: weekStart, to: lastDay }); weekStart = null; continue; }
    if ((m = l.match(new RegExp(`^TOTAL M[ÊE]S ${MONEY}`, "i")))) { res.monthMeta = N(m[1]); continue; }
    if ((m = l.match(new RegExp(`^SEMANA (\\d) ${MONEY}(?: ${MONEY})?(?: ${MONEY})?(?: (META|OURO|DIAMANTE) ${MONEY})?`, "i")))) {
      res.weeks[Number(m[1]) - 1] = { meta: N(m[2]), ouro: m[3] ? N(m[3]) : null, diamante: m[4] ? N(m[4]) : null };
      if (m[5]) res.prizes[m[5].toLowerCase()] = N(m[6]);
      continue;
    }
    if ((m = l.match(new RegExp(`^TOTAL ${MONEY}(?: ${MONEY})?(?: ${MONEY})?$`)))) res.tiersTotal = { meta: N(m[1]), ouro: m[2] ? N(m[2]) : null, diamante: m[3] ? N(m[3]) : null };
  }
  res.store = res.label ? goalStoreOf(res.label) : null;
  if (!res.store) res.warnings.push(`loja "${res.label || "?"}" não reconhecida`);
  if (!res.ym) { res.warnings.push("nenhuma data encontrada"); return res; }
  const [Y, M] = res.ym.split("-").map(Number), dim = new Date(Y, M, 0).getDate();
  const days = Array.from({ length: dim }, (_, i) => res.days[i + 1] ?? null);
  const filled = days.filter(x => x).length, daySum = days.reduce((a, x) => a + (x || 0), 0);
  res.monthMeta ||= daySum;
  const entry = { label: res.label, monthMeta: res.monthMeta, results: {}, ly: null, weekRanges: res.weekRanges, prizes: Object.keys(res.prizes).length ? { meta: res.prizes.meta ?? null, ouro: res.prizes.ouro ?? null, diamante: res.prizes.diamante ?? null } : null, weeks: null };
  if (filled === dim) {
    entry.days = days;
    if (Math.abs(daySum - res.monthMeta) > 1) res.warnings.push(`as metas diárias somam ${Math.round(daySum)}, mas o total do mês é ${Math.round(res.monthMeta)}`);
  } else res.warnings.push(`meta diária em só ${filled} de ${dim} dias: importada só a meta do mês, distribuída pelo peso dos dias`);
  if (res.weeks.length && res.weeks.length === res.weekRanges.length) {
    const w = res.weekRanges.map((r, i) => ({ ...r, ...res.weeks[i] }));
    const sum = w.reduce((a, x) => a + (x.meta || 0), 0);
    if (Math.abs(sum - res.monthMeta) > 1) res.warnings.push(`as semanas somam ${Math.round(sum)}, mas o mês é ${Math.round(res.monthMeta)}: semanas não importadas`);
    else {
      entry.weeks = w;
      if (entry.days) w.forEach((x, i) => { const s = entry.days.slice(x.from - 1, x.to).reduce((a, v) => a + v, 0); if (Math.abs(s - x.meta) > 1) res.warnings.push(`semana ${i + 1}: meta ${Math.round(x.meta)}, mas as diárias somam ${Math.round(s)}`); });
      if (w.some(x => !x.ouro || !x.diamante)) res.warnings.push("Ouro e Diamante não preenchidos: só a Meta foi importada");
    }
  } else if (res.weekRanges.length) res.warnings.push("tabela Meta/Ouro/Diamante não encontrada: semanas montadas pelas metas diárias");
  res.entry = entry;
  return res;
}

// pdf.js (carregado só quando um PDF é importado)
let pdfjsLoading = null;
function loadPdfjs() {
  if (!pdfjsLoading) {
    const base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/";
    pdfjsLoading = import(base + "pdf.min.mjs").then(lib => { lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.mjs"; return lib; })
      .catch(e => { pdfjsLoading = null; throw new Error("Não foi possível carregar o leitor de PDF. Verifique a internet."); });
  }
  return pdfjsLoading;
}
async function pdfTextLines(buf) {
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  const out = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let r = rows.find(r => Math.abs(r.y - y) < 2.5);
      if (!r) { r = { y, items: [] }; rows.push(r); }
      r.items.push({ x, s: it.str.trim() });
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => out.push(r.items.sort((a, b) => a.x - b.x).map(i => i.s).join(" ")));
  }
  return out;
}
function isPdf(file, buf) { const h = new Uint8Array(buf.slice(0, 5)); return /\.pdf$/i.test(file.name) || String.fromCharCode(...h) === "%PDF-"; }

// Vários PDFs de meta de uma vez (um por loja). Somente administração.
async function readGoalPdfs(files) {
  if (!isBoard()) return toast("Somente a administração pode importar metas.", "warn");
  showImpBusy(`Lendo ${files.length} PDF(s)...`);
  const parsed = { months: {}, warnings: [], ignored: {} };
  const errors = [];
  for (const f of files) {
    try {
      const r = parseGoalPdfLines(await pdfTextLines(await f.arrayBuffer()), f.name);
      if (!r.store || !r.entry) { errors.push(`${f.name}: ${r.warnings.join("; ") || "formato não reconhecido"}`); if (r.label && !r.store && r.ym) (parsed.ignored[r.label] ||= []).push(r.ym); continue; }
      if (parsed.months[r.ym]?.[r.store]) r.warnings.push(`mais de um PDF para a mesma loja e mês; vale o último (${f.name})`);
      (parsed.months[r.ym] ||= {})[r.store] = r.entry;
      r.warnings.forEach(msg => parsed.warnings.push({ ym: r.ym, store: r.store, msg }));
    } catch (e) { errors.push(`${f.name}: ${e.message || "não foi possível ler"}`); }
  }
  if (!Object.keys(parsed.months).length) { imp = null; renderImport(); return toast(errors[0] || "Nenhuma meta encontrada nos PDFs.", "error"); }
  imp = { kind: "goals", pdf: true, file: files.length === 1 ? files[0].name : `${files.length} PDFs de meta`, parsed, errors, opts: { goals: true, results: false, ly: false } };
  renderImport();
}

async function readImportFiles(list) {
  const files = [...(list || [])];
  if (!files.length) return;
  if (!isBoard()) return toast("Somente a administração pode importar arquivos.", "warn");
  const bufs = await Promise.all(files.map(f => f.slice(0, 5).arrayBuffer()));
  const pdfs = files.filter((f, i) => isPdf(f, bufs[i]));
  if (pdfs.length) {
    if (pdfs.length < files.length) toast("Arquivos que não são PDF foram ignorados. Importe-os separadamente.", "warn");
    return readGoalPdfs(pdfs);
  }
  return readImportFile(files[0]);
}

async function readImportFile(file) {
  if (!file) return;
  if (!isBoard()) return toast("Somente a administração pode importar arquivos.", "warn");
  try {
    const buf = await file.arrayBuffer();
    const text = new TextDecoder("windows-1252").decode(buf);
    if (looksLikeNps(text) || looksLikeNps(new TextDecoder("utf-8").decode(buf))) {
      const utf = new TextDecoder("utf-8").decode(buf);
      imp = { kind: "nps", file: file.name, result: parseNps(/\uFFFD/.test(utf) ? text : utf) };
      renderImport();
      return;
    }
    if (looksLikeLoyalty(text)) {
      imp = { kind: "loyalty", file: file.name, result: parseLoyalty(text) };
      renderImport();
      return;
    }
    if (looksLikeProductReport(text)) {
      imp = { kind: "products", file: file.name, text, codeMap: { ...STORE_CODES } };
      renderImport();
      return;
    }
    if (looksLikeZacan(text)) {
      const codes = [...new Set(text.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(";")[0].trim()))];
      imp = { kind: "zacan", file: file.name, text, codeMap: Object.fromEntries(codes.map(c => [c, STORE_CODES[c] || ""])) };
      renderImport();
      return;
    }
    const XLSX = await loadXlsx();
    // Planilha de metas (abas mensais)
    const wbg = XLSX.read(buf, { type: "array", cellDates: true });
    if (looksLikeGoalWorkbook(wbg.SheetNames)) {
      const sheets = {};
      wbg.SheetNames.forEach(n => { if (sheetMonth(n)) sheets[n] = XLSX.utils.sheet_to_json(wbg.Sheets[n], { header: 1, raw: true, defval: null }).slice(0, 80); });
      imp = { kind: "goals", file: file.name, parsed: parseGoalWorkbook(sheets), opts: { goals: true, results: true, ly: true } };
      renderImport();
      return;
    }
    const wb = XLSX.read(buf, { type: "array", raw: true, cellDates: false });
    let best = null;
    wb.SheetNames.forEach(n => { const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: "" }); if (!best || rows.length > best.length) best = rows; });
    const rows = best.filter(r => r.some(c => String(c).trim() !== ""));
    // cabeçalho: primeira linha com 3+ células de texto
    const hi = Math.max(0, rows.findIndex(r => r.filter(c => String(c).trim()).length >= 3));
    const header = rows[hi].map((h, i) => String(h).trim() || `Coluna ${i + 1}`);
    const body = rows.slice(hi + 1);
    const guess = (re) => header.findIndex(h => re.test(h.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()));
    imp = { file: file.name, header, body,
      map: { date: guess(/data|dia|date/), store: guess(/loja|filial|empresa|unidade|store/), value: guess(/valor|venda|total|faturamento|liquido/), tickets: guess(/cupo|ticket|qtd.*venda|vendas$|atendimento|nf/) },
      storeMap: {} };
    renderImport();
  } catch (e) { toast(e.message || "Não foi possível ler o arquivo.", "error"); }
}

function parseBRNumber(v) {
  if (typeof v === "number") return v;
  let s = String(v).replace(/[R$\s]/g, "");
  if (!s || s === "-") return 0;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  return Number(s) || 0;
}
function parseDate(v) {
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  if (/^\d{5}$/.test(s)) { const d = new Date(Math.round((Number(s) - 25569) * 86400000)); return d.toISOString().slice(0, 10); }
  return null;
}
function guessStore(name) {
  const n = String(name).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  return STORES.find(s => n.includes(shortStore(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase())) || "";
}

        ${preview.skip ? `<br><span class="text-xs">${preview.skip} linha(s) ignorada(s) (sem data válida ou loja ignorada).</span>` : ""}
        <br><span class="text-xs">Dias e lojas que já existem serão substituídos pelos valores do arquivo.</span></div>` : ""}
      <button onclick="confirmImport()" class="btn-primary w-full" ${preview?.ok ? "" : "disabled"}>Importar vendas</button>
    </div>`;
}
function isoToBRs(s) { return s ? s.split("-").reverse().join("/") : "—"; }
function confirmImport() {
  const p = imp.preview;
  Object.entries(p.out).forEach(([k, v]) => { const [d, st] = k.split("|"); (S.sales[d] ||= {})[st] = { v: Math.round(v.v * 100) / 100, t: v.t || Math.max(1, Math.round(v.v / 42)) }; });
  S.imports.unshift({ at: Date.now(), file: imp.file, rows: p.ok, by: isBoard() ? "Diretoria" : "Gerente" });
  S.view.month = p.to.slice(0, 7);
  imp = null; save(); renderSelectors(); go("home");
  toast(`${p.ok} linha(s) importada(s).`);
}

startApp();
</script>
