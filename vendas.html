<script>
/* =========================================================
   Leitor do arquivo de vendas do sistema (ZACAN ..._VND_PERIODO_...txt)
   Uma linha por venda, campos separados por ";" (sem cabeçalho):
   0 loja | 4 data e hora | 5 valor líquido | 9 cliente | 10 forma de pagamento
   11 desconto (%) | 14 operador | 16 promoção | 18 itens | 20 valor bruto | 21 canal
   ========================================================= */
const STORE_CODES = { BSHAR: "CB Aricanduva", BSHCV: "CB Center Vale", BJORI: "CB Jardim Oriente Shopping", BSMOG: "CB Mogi", BSHVS: "CB Vale Sul" };
const NO_FIN = "Sem financeiro (voucher, cortesia, ADM)";

function zNum(s) { s = String(s || "").trim(); return s ? Number(s.replace(/\./g, "").replace(",", ".")) || 0 : 0; }
function r2(n) { return Math.round(n * 100) / 100; }
function titleCase(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Da|De|Do|Dos|Das|E)\b/g, w => w.toLowerCase()); }

function payGroup(p) {
  const u = String(p || "").toUpperCase();
  if (u.includes(",")) return "Mais de uma forma";
  if (u.includes("GERA FINANCEIRO") || u === "CORTESIA") return NO_FIN;
  if (u === "PIX") return "PIX";
  if (u === "DINHEIRO") return "Dinheiro";
  if (u.includes("IFOOD")) return "iFood";
  if (u.startsWith("REF") || u.startsWith("ALIM")) return "Vale-refeição / alimentação";
  if (/ELECTRON|MAESTRO|DEBITO/.test(u)) return "Débito";
  if (/VISA|MASTERCARD|ELO|AMEX|HIPER|DINERS|CREDITO/.test(u)) return "Crédito";
  return "Outros";
}
function channelOf(c) { const u = String(c || "").trim().toUpperCase(); if (!u) return "Balcão"; if (u.includes("IFOOD")) return "iFood"; if (u.includes("GCOM")) return "Mobile (GCOM)"; return titleCase(u); }
function customerOf(c) { const u = String(c || "").toUpperCase(); if (u.includes("CONSUMIDOR FINAL")) return "Consumidor final"; if (u.includes("SEM CADASTRO")) return "Fidelidade sem cadastro"; return "Cliente identificado"; }

// Reconhece o formato: 22 campos por linha e código de loja na 1ª coluna.
function looksLikeZacan(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 20);
  return lines.length > 0 && lines.every(l => l.split(";").length >= 21 && /^[A-Z]{3,8}$/.test(l.split(";")[0]) && /^\d{2}\/\d{2}\/\d{4}/.test(l.split(";")[4]));
}

// Agrega por dia e loja. codeMap: código da loja -> nome da loja no app ("" = ignorar).
function parseZacan(text, codeMap = STORE_CODES) {
  const days = {}; const unknown = {}; let rows = 0, skipped = 0;
  text.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const f = line.split(";");
    if (f.length < 21) { skipped++; return; }
    const code = f[0].trim();
    const store = codeMap[code];
    if (!store) { unknown[code] = (unknown[code] || 0) + 1; skipped++; return; }
    const m = f[4].match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2})/);
    if (!m) { skipped++; return; }
    const date = `${m[3]}-${m[2]}-${m[1]}`, hour = String(Number(m[4]));
    const v = zNum(f[5]), b = zNum(f[20]) || v, items = zNum(f[18]);
    const d = ((days[date] ||= {})[store] ||= { v: 0, b: 0, t: 0, i: 0, h: {}, p: {}, o: {}, pr: {}, c: {}, cl: {} });
    const add = (obj, k, vals) => { const cur = obj[k] ||= vals.map(() => 0); vals.forEach((x, i) => { cur[i] += x; }); };
    d.v += v; d.b += b; d.t += 1; d.i += items;
    add(d.h, hour, [v, 1]);
    add(d.p, payGroup(f[10]), [v, 1]);
    add(d.o, titleCase(f[14]) || "Sem operador", [v, 1, items]);
    const promo = String(f[16] || "").trim();
    if (promo || b - v > 0.004) add(d.pr, promo || "Desconto sem promoção", [1, b - v]);
    add(d.c, channelOf(f[21]), [v, 1]);
    add(d.cl, customerOf(f[9]), [v, 1]);
    rows++;
  });
  // arredonda
  Object.values(days).forEach(byStore => Object.values(byStore).forEach(d => {
    d.v = r2(d.v); d.b = r2(d.b);
    ["h", "p", "o", "pr", "c", "cl"].forEach(k => Object.values(d[k]).forEach(a => a.forEach((x, i) => { a[i] = r2(x); })));
  }));
  return { days, rows, skipped, unknown };
}


// Vendas reais importadas de ZACAN_BSHCV_VND_PERIODO_20260930_00-01.txt (01 a 29/09/2026)
const SEED_DAYS = {};


/* =========================================================

   ========================================================= */
const ICONS = {

  tag: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
  bars: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
function icon(n, cls = "w-5 h-5") { return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ""}</svg>`; }
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
function money(v, short = false) {
  const n = Number(v) || 0;
  if (short && Math.abs(n) >= 1000) return "R$ " + (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: n >= 100000 ? 0 : 1 }) + " mil";
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}
function money2(v) { return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function intf(v) { return Math.round(Number(v) || 0).toLocaleString("pt-BR"); }
function pct(v, d = 0) { return `${((Number(v) || 0) * 100).toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d })}%`; }
function deltaChip(cur, prev, label) {
  if (!prev) return `<span class="text-[11px] text-stone-400">sem base de comparação</span>`;
  const d = cur / prev - 1;
  const up = d >= 0;
  return `<span class="inline-flex items-center gap-0.5 text-[11px] font-bold ${up ? "text-emerald-700" : "text-rose-700"}">${icon(up ? "up" : "down", "w-3 h-3")}${pct(Math.abs(d), 1)}</span> <span class="text-[11px] text-stone-500">${label}</span>`;
}
function toast(msg, kind = "success") {
  const cls = { success: "bg-emerald-700 text-white", error: "bg-rose-700 text-white", info: "bg-stone-900 text-white", warn: "bg-amber-500 text-stone-950" }[kind];
  const el = document.createElement("div");
  el.className = `toast pointer-events-auto rounded-2xl shadow-float px-4 py-3 text-sm font-semibold ${cls}`;
  el.textContent = msg; el.onclick = () => el.remove();
  document.getElementById("toast-root").appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
const MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const WD = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
function monthLabel(ym) { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; }
function daysInMonth(ym) { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function shiftMonth(ym, n) { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function dateOf(ym, day) { return `${ym}-${String(day).padStart(2, "0")}`; }
function shortStore(s) { return s.replace(/^(SP - )?CB /i, ""); }

/* =========================================================
   Dados de exemplo
   ========================================================= */
const STORES = ["CB Aricanduva", "CB Center Vale", "CB Jardim Oriente Shopping", "CB Mogi", "CB Vale Sul"];
const STORAGE_KEY = "cb-vendas-prototipo-v10";
// Metas de setembro/2026 (PDFs META_*_09_26): diárias, semanais com níveis e prêmios semanais.
const SEED_PLANS = {};
// Vendas por produto (AnaliseDetalhadoProdutoVenda, 01 a 29/09/2026): loja -> código -> [nome, qtde, bruto, desconto, líquido]

/* =========================================================
   Leitor da planilha de metas (modelo DASHBOARD_CB_2026)
   Uma aba por mês ("Out 2026", "Set 2026"...); a aba PAINEL é ignorada.
   Em cada aba, as lojas ficam lado a lado em blocos de colunas:
     linha 1: NOME DA LOJA | | META | RESULTADO | DIFERENÇA | Tickets | TM | Deb
     linhas seguintes: data | dia da semana | meta do dia | resultado | ... | tickets
     "TOTAL SEMANA n" fecha cada semana; "TOTAL MÊS" fecha o mês.
   Abaixo: "MÊS 2025" (FAT, TICKETS, TM do ano anterior) e a tabela
   META / OURO / DIAMANTE / PRÊMIO SEMANAL por semana.
   ========================================================= */
const GOAL_MONTHS = { JAN: 1, FEV: 2, MAR: 3, ABR: 4, MAI: 5, JUN: 6, JUL: 7, AGO: 8, SET: 9, OUT: 10, NOV: 11, DEZ: 12 };
const GOAL_STORE_ALIASES = [
  [/CENTER\s*VALE|CENTERVALE/, "CB Center Vale"],
  [/VALE\s*SUL/, "CB Vale Sul"],
  [/ORIENTE|HYDE/, "CB Jardim Oriente Shopping"],
  [/MOGI/, "CB Mogi"],
  [/ARICANDUVA|ARICA/, "CB Aricanduva"]
];
function gNorm(v) { return String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, " ").trim(); }
function gNum(v) { if (typeof v === "number" && isFinite(v)) return v; if (typeof v === "string" && /^-?[\d.,]+$/.test(v.trim())) { const s = v.includes(",") ? v.replace(/\./g, "").replace(",", ".") : v; const n = Number(s); return isFinite(n) ? n : null; } return null; }
function gDate(v) {
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}-${String(v.getDate()).padStart(2, "0")}`;
  if (typeof v === "string") { let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`; m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m) return `${m[3].length === 2 ? "20" + m[3] : m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }

  return null;
}

function sheetMonth(name) { const m = gNorm(name).match(/^(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\w*\s+(\d{4})$/); return m ? `${m[2]}-${String(GOAL_MONTHS[m[1]]).padStart(2, "0")}` : null; }
function looksLikeGoalWorkbook(sheetNames) { return sheetNames.filter(sheetMonth).length >= 1; }

// sheets: { nomeDaAba: linhas (matriz de células) }
function parseGoalWorkbook(sheets) {
  const months = {}, warnings = [], ignored = {};
  const warn = (ym, store, msg) => warnings.push({ ym, store, msg });
  Object.entries(sheets).forEach(([sheetName, rows]) => {
    const ym = sheetMonth(sheetName);
    if (!ym || /^C[OÓ]PIA/i.test(sheetName.trim())) return;
    const head = rows[0] || [];
    const [Y, M] = ym.split("-").map(Number);
    const dim = new Date(Y, M, 0).getDate();
    for (let c = 0; c < head.length; c++) {
      if (typeof head[c] !== "string" || gNorm(head[c + 2]) !== "META" || !head[c].trim()) continue;
      const label = head[c].trim();
      const store = goalStoreOf(label);
      if (!store) { (ignored[label] ||= new Set()).add(ym); continue; }
      const days = Array(dim).fill(null), results = {}, weekRanges = [];
      let weekStart = null, lastDay = null, monthRow = null, endRow = 1;

        const key = gNorm(row[c]);

          const d = Number(date.slice(8));
          const meta = gNum(row[c + 2]), res = gNum(row[c + 3]), tk = gNum(row[c + 5]);

        } else if (/^TOTAL SEMANA/.test(key)) {

          weekStart = null;
        } else if (/^TOTAL M/.test(key)) { monthRow = row; endRow = r; break; }
      }

      let ly = null, tiersRow = null;
      for (let r = endRow; r < Math.min(rows.length, endRow + 40); r++) {
        const row = rows[r] || [];
        if (!ly && /^[A-Z]+ \d{4}$/.test(gNorm(row[c])) && gNorm(rows[r + 1]?.[c]) === "FAT") {
          const v = gNum(rows[r + 1][c + 1]), t = gNum(rows[r + 2]?.[c + 1]);

      const daySum = days.reduce((a, x) => a + (x || 0), 0);
      const monthMeta = gNum(monthRow?.[c + 2]) || daySum;

      if (tiersRow !== null) {
        const wk = [];
        for (let r = tiersRow + 1; r < tiersRow + 6; r++) { const row = rows[r] || []; if (/^SEMANA/.test(gNorm(row[c]))) wk.push({ meta: gNum(row[c + 2]), ouro: gNum(row[c + 3]), diamante: gNum(row[c + 4]) }); }

        if (Object.keys(pz).length) prizes = { meta: pz.meta ?? null, ouro: pz.ouro ?? null, diamante: pz.diamante ?? null };

      if (filled >= Math.ceil(dim * 0.8)) {

      } else {
        warn(ym, store, filled ? `meta diária preenchida em só ${filled} de ${dim} dias: importada só a meta do mês (${Math.round(monthMeta)}), distribuída pelo peso dos dias` : "sem metas diárias");
      }
      if (weeks) {
        const sumMeta = weeks.reduce((a, w) => a + (w.meta || 0), 0);
        const weekDaySums = entry.days ? weeks.map(w => entry.days.slice(w.from - 1, w.to).reduce((a, x) => a + x, 0)) : null;
        const bad = weeks.some(w => !w.meta) || Math.abs(sumMeta - monthMeta) > 1;
        if (bad) {
          warn(ym, store, `tabela de níveis inconsistente (semanas: ${weeks.map(w => Math.round(w.meta || 0)).join(" / ")}; mês ${Math.round(monthMeta)}): semanas não importadas`);
          weeks = null;
        } else {
          if (weekDaySums && weeks.some((w, i) => Math.abs(weekDaySums[i] - w.meta) > 1)) warn(ym, store, "a meta de alguma semana difere da soma das metas diárias dela");
          if (weeks.some(w => !w.ouro || !w.diamante)) warn(ym, store, "níveis Ouro e Diamante não preenchidos: só a Meta foi importada");

    }
  });
  return { months, warnings, ignored: Object.fromEntries(Object.entries(ignored).map(([k, v]) => [k, [...v].sort()])) };
}

function tmGoalFor(ym, stores) {

  stores.forEach(s => { if (d[s]) { v += d[s].v; t += d[s].t; any = true; } });

function lastDataDay(ym) {

function wOf(date) { return S.weights[new Date(date + "T00:00:00").getDay()]; }

function dayGoal(ym, d, stores) {

  stores.forEach(st => {
    const p = planOf(ym, st);
    if (p?.days?.[d - 1] != null) { g += p.days[d - 1]; return; }

    let wsum = 0; for (let x = 1; x <= daysInMonth(ym); x++) wsum += wOf(dateOf(ym, x));

  const tot = k => ps.every(p => p.month[k]) ? ps.reduce((n, p) => n + p.month[k], 0) : null;

// Resumo do mês para um conjunto de lojas
function monthStats(ym, stores = selStores(), uptoDay = null) {
  const dim = daysInMonth(ym);
  const last = uptoDay ?? lastDataDay(ym);
  let v = 0, t = 0, wDone = 0, wAll = 0;
  const days = [];
  const hasGoal = stores.some(s => (S.goals[ym]?.[s] || 0) > 0);
  for (let d = 1; d <= dim; d++) {
    const date = dateOf(ym, d);
    const w = hasGoal ? dayGoal(ym, d, stores) : wOf(date); wAll += w;
    const tot = d <= last ? dayTotal(date, stores) : null;
    if (d <= last) wDone += w;

    days.push({ d, date, w, v: tot?.v ?? null, t: tot?.t ?? null });
  }
  const goal = stores.reduce((n, s) => n + (S.goals[ym]?.[s] || 0), 0);
  const expectedShare = wAll ? wDone / wAll : 0;              // onde deveria estar hoje (fração da meta)
  const projection = wDone ? v / wDone * wAll : 0;            // ritmo atual, respeitando o peso dos dias da semana
  const remainingDays = dim - last;
  const needPerDay = remainingDays > 0 ? Math.max(0, goal - v) / remainingDays : 0;

// Soma os detalhes (horário, pagamento, operador, promoções, canal, cliente) do mês.
function monthAgg(ym, stores = selStores()) {

  Object.entries(S.sales).forEach(([date, byStore]) => {
    if (!date.startsWith(ym)) return;
    stores.forEach(st => {
      const d = byStore[st]; if (!d) return;
      A.v += d.v; A.b += d.b ?? d.v; A.t += d.t; A.i += d.i || 0;
      if (d.h) A.detailed = true;
      ["h", "p", "c", "cl", "pr"].forEach(k => Object.entries(d[k] || {}).forEach(([n, vals]) => add(A[k], n, vals)));
      Object.entries(d.o || {}).forEach(([n, vals]) => add(A.o, stores.length > 1 ? `${n}|${st}` : n, vals));

  });
  A.discount = Math.max(0, A.b - A.v);
  A.noFin = A.p[NO_FIN]?.[0] || 0;
  return A;
}

function paceTone(st) {
  if (!st.goal) return { bar: "#78716C", text: "text-stone-600", chip: "bg-stone-100 text-stone-600", label: "Sem meta" };
  if (st.projPct >= 1) return { bar: "#059669", text: "text-emerald-700", chip: "bg-emerald-100 text-emerald-800", label: "No ritmo da meta" };
  if (st.projPct >= 0.95) return { bar: "#F59E0B", text: "text-amber-700", chip: "bg-amber-100 text-amber-800", label: "Perto da meta" };
  return { bar: "#E11D48", text: "text-rose-700", chip: "bg-rose-100 text-rose-700", label: "Abaixo do ritmo" };
}
function goalBar(st, tiers = null) {
  const tone = paceTone(st);
  if (tiers) {
    const max = Math.max(tiers.diamante || tiers.ouro || tiers.meta, st.v) * 1.04;
    const mk = (v, label, color) => `<div class="absolute -top-1 -bottom-1 w-0.5 rounded" style="left:${v / max * 100}%;background:${color}" title="${label}: ${money(v)}"></div>`;
    return `<div class="space-y-1">
      <div class="goalbar" role="img" aria-label="${money(st.v)} vendidos. Meta ${money(tiers.meta)}, Ouro ${money(tiers.ouro)}, Diamante ${money(tiers.diamante)}">
        <div class="fill" style="width:${Math.min(100, st.v / max * 100)}%;background:${tone.bar}"></div>
        ${TIERS.filter(([k]) => tiers[k]).map(([k, l, c]) => mk(tiers[k], l, c)).join("")}
        ${st.expectedShare && st.last < st.dim ? `<div class="tick" style="left:calc(${Math.min(100, tiers.meta * st.expectedShare / max * 100)}% - 1px)" title="Esperado até hoje: ${money(tiers.meta * st.expectedShare)}"></div>` : ""}
      </div>
      <div class="relative h-4 text-[10px] font-bold">${TIERS.filter(([k]) => tiers[k]).map(([k, l, c]) => `<span class="absolute -translate-x-1/2 whitespace-nowrap" style="left:${tiers[k] / max * 100}%;color:${c}">${l}</span>`).join("")}</div>
    </div>`;
  }
  return `<div class="goalbar" role="img" aria-label="${pct(st.pctGoal)} da meta atingido; o esperado até hoje era ${pct(st.expectedShare)}">
    <div class="fill" style="width:${Math.min(100, st.pctGoal * 100)}%;background:${tone.bar}"></div>
    ${st.goal && st.last < st.dim ? `<div class="tick" style="left:calc(${Math.min(100, st.expectedShare * 100)}% - 1px)" title="Esperado até hoje: ${pct(st.expectedShare)}"></div>` : ""}
  </div>`;
}

/* =========================================================
   Gráficos (SVG simples)
   ========================================================= */
function cumulativeChart(st) {
  const W = 680, H = 240, L = 52, R = 14, T = 16, B = 30;
  const dim = st.dim;
  const wAll = st.days.reduce((n, d) => n + d.w, 0);
  let accGoal = 0, accReal = 0;
  const goalPts = [], realPts = [], bars = [];
  st.days.forEach(d => {
    accGoal += st.goal * d.w / wAll;
    goalPts.push([d.d, accGoal]);
    if (d.v !== null) { accReal += d.v; realPts.push([d.d, accReal]); }
    bars.push([d.d, d.v]);
  });
  const maxY = Math.max(st.goal, accReal, st.projection) * 1.05 || 1;
  const maxBar = Math.max(1, ...bars.map(b => b[1] || 0));
  const x = d => L + ((d - 0.5) / dim) * (W - L - R);
  const y = v => T + (1 - v / maxY) * (H - T - B);
  const bw = Math.max(3, (W - L - R) / dim - 4);
  let grid = "";
  for (let i = 0; i <= 4; i++) { const v = maxY * i / 4; grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ECEAE7"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#78716c">${v >= 1000 ? Math.round(v / 1000) + "k" : Math.round(v)}</text>`; }
  const barsSvg = bars.map(([d, v]) => v === null ? "" : `<rect x="${x(d) - bw / 2}" y="${H - B - (v / maxBar) * (H - T - B) * 0.35}" width="${bw}" height="${(v / maxBar) * (H - T - B) * 0.35}" rx="2" fill="#4A0E17" opacity=".13"><title>Dia ${d}: ${money(v)}</title></rect>`).join("");
  const path = pts => pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const lastReal = realPts[realPts.length - 1];
  const projLine = lastReal && st.last < dim ? `<path d="M${x(lastReal[0])},${y(lastReal[1])} L${x(dim)},${y(st.projection)}" stroke="#4A0E17" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity=".6"/>` : "";
  const labels = [1, 5, 10, 15, 20, 25, dim].filter((v, i, a) => a.indexOf(v) === i).map(d => `<text x="${x(d)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#78716c">${d}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Vendas acumuladas no mês comparadas à meta">
    ${grid}${barsSvg}
    ${st.goal ? `<path d="${path(goalPts)}" fill="none" stroke="#A8A29E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>` : ""}
    <path d="${path(realPts)}" fill="none" stroke="#4A0E17" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${projLine}
    ${lastReal ? `<circle cx="${x(lastReal[0])}" cy="${y(lastReal[1])}" r="5" fill="#fff" stroke="#4A0E17" stroke-width="2.5"/>` : ""}
    ${labels}
  </svg>`;
}

/* =========================================================
   Painel simples: vendido x meta, ritmo e quanto falta por dia
   ========================================================= */
function storeLastDay(ym, stores) { let last = 0; for (let d = 1; d <= daysInMonth(ym); d++) if (dayTotal(dateOf(ym, d), stores)) last = d; return last; }
function simpleStats(ym, stores) {
  const st = monthStats(ym, stores, storeLastDay(ym, stores));
  const expected = st.goal * st.expectedShare;
  const last = st.last;
  const y = last ? dayTotal(dateOf(ym, last), stores) : null;
  const yGoal = last ? dayGoal(ym, last, stores) : 0;
  const weeks = monthWeeks(ym);
  const wi = Math.max(0, weeks.findIndex(w => (last || 1) >= w.from && (last || 1) <= w.to));
  const curW = last >= weeks[wi].to && weeks[wi + 1] ? weeks[wi + 1] : weeks[wi];
  let wv = 0, wg = 0;
  for (let d = curW.from; d <= curW.to; d++) { wg += dayGoal(ym, d, stores); if (d <= last) wv += dayTotal(dateOf(ym, d), stores)?.v || 0; }
  const past = ym < TODAY_ISO.slice(0, 7);
  // Mês corrente: dias restantes contam a partir de hoje (dias sem lançamento não voltam).
  let gap = 0;
  if (ym === TODAY_ISO.slice(0, 7)) {
    const today = Number(TODAY_ISO.slice(8));
    gap = Math.max(0, today - 1 - last);
    st.remainingDays = st.dim - today + 1;
    st.needPerDay = st.remainingDays > 0 ? Math.max(0, st.goal - st.v) / st.remainingDays : 0;
  }
  return { st, past, gap, expected, diff: st.v - expected, y, yGoal, week: { ...curW, n: weeks.indexOf(curW) + 1, v: wv, g: wg, left: past ? 0 : Math.max(0, curW.to - last) } };
}
function statusOf(x) {
  const { st, diff } = x;
  if (!st.goal) return { tone: "stone", label: "Sem meta", text: "A meta deste mês ainda não foi lançada." };
  if (!st.last) return { tone: "stone", label: "Começando", text: "Ainda não há vendas registradas neste mês." };
  if (st.last >= st.dim || x.past) return st.v >= st.goal ? { tone: "emerald", label: "Meta batida", text: `Fechou o mês ${money(st.v - st.goal)} acima da meta.` } : { tone: "rose", label: "Não bateu", text: `Fechou o mês ${money(st.goal - st.v)} abaixo da meta.` };
  if (st.v >= st.goal) return { tone: "emerald", label: "Meta batida", text: `A meta do mês já foi batida. Tudo o que vender agora é extra.` };
  if (diff >= 0) return { tone: "emerald", label: "No ritmo", text: `Está ${money(diff)} acima do esperado até hoje.` };
  if (diff >= -0.05 * st.goal * st.expectedShare) return { tone: "amber", label: "Atenção", text: `Está ${money(-diff)} abaixo do esperado até hoje.` };
  return { tone: "rose", label: "Abaixo", text: `Está ${money(-diff)} abaixo do esperado até hoje.` };
}
const TONE = { emerald: ["bg-emerald-100 text-emerald-800", "#059669", "text-emerald-700"], amber: ["bg-amber-100 text-amber-900", "#F59E0B", "text-amber-700"], rose: ["bg-rose-100 text-rose-700", "#E11D48", "text-rose-700"], stone: ["bg-stone-100 text-stone-600", "#78716C", "text-stone-600"] };

function simpleBar(x, color) {
  const { st } = x;
  const p = st.goal ? Math.min(100, st.v / st.goal * 100) : 0;
  const e = st.goal ? Math.min(100, st.expectedShare * 100) : 0;
  return `<div class="relative h-4 rounded-full bg-stone-100" role="img" aria-label="${pct(st.goal ? st.v / st.goal : 0)} da meta; esperado até hoje ${pct(st.expectedShare)}">
    <div class="absolute inset-y-0 left-0 rounded-full" style="width:${p}%;background:${color}"></div>
    ${st.goal && st.last && st.last < st.dim && !x.past ? `<div class="absolute -top-1.5 -bottom-1.5 w-[3px] rounded bg-cb-ink" style="left:calc(${e}% - 1.5px)" title="Onde deveria estar hoje"></div>` : ""}
  </div>`;
}

// Prêmios por nível de meta (cada loja tem os seus valores; vale só o maior nível atingido na semana)
function prizesCard(ym, stores) {
  const rows = stores.map(s => ({ s, p: planOf(ym, s) })).filter(r => r.p?.prizes && r.p?.weeks?.length);
  if (!rows.length) return "";
  const weeks = monthWeeks(ym), dim = daysInMonth(ym), td = todayDayOf(ym);
  const brl = v => v == null ? "—" : "R$ " + Number(v).toLocaleString("pt-BR", { maximumFractionDigits: 2 });
  const TC = Object.fromEntries(TIERS.map(([k, l, c]) => [k, { l, c }]));

  const body = rows.map(({ s, p }) => {
    let earned = 0;
    const cells = weeks.map((w, wi) => {

      if (future) return `<td class="px-2 py-2.5 text-center text-[11px] text-stone-400" data-tip="${tip}">a começar</td>`;

        if (lvl) earned += p.prizes[lvl] || 0;
        return `<td class="px-2 py-2.5 text-center" data-tip="${tip}">${lvl ? `<span class="inline-flex flex-col items-center leading-tight"><span class="text-[10px] font-extrabold uppercase tracking-wider" style="color:${TC[lvl].c}">${TC[lvl].l}</span><b class="tabular text-[13px]">${brl(p.prizes[lvl])}</b></span>` : `<span class="text-[11px] font-bold text-rose-700">não atingiu</span>`}</td>`;
      }
      const next = TIERS.find(([k]) => st.v < pw[k]);
      return `<td class="px-2 py-2.5 text-center" data-tip="${tip}"><span class="inline-flex flex-col items-center leading-tight"><span class="text-[10px] font-bold text-sky-800 bg-sky-100 rounded px-1.5">em andamento</span>${lvl ? `<span class="text-[11px] font-bold mt-0.5" style="color:${TC[lvl].c}">${TC[lvl].l} garantido${lvl === "meta" ? "a" : ""}</span>` : ""}${next ? `<span class="text-[10.5px] text-stone-500 mt-0.5">${TC[next[0]].l}: falta ${money(pw[next[0]] - st.v)}</span>` : ""}</span></td>`;
    }).join("");
    const maxMonth = weeks.length * (p.prizes.diamante || 0);
    grand += earned; grandMax += maxMonth;
    return `<tr class="border-t border-stone-100">
      <td class="py-2.5 pl-4 pr-2 whitespace-nowrap font-bold"><span class="inline-block w-2.5 h-2.5 rounded-sm mr-2 align-middle" style="background:${storeColor(s)}"></span>${esc(shortStore(s))}</td>
      ${TIERS.map(([k, , c]) => `<td class="px-2 text-right tabular font-extrabold" style="color:${c}">${brl(p.prizes[k])}</td>`).join("")}
      <td class="w-3 bg-stone-50"></td>
      ${cells}
      <td class="px-2 pr-4 text-right tabular font-extrabold whitespace-nowrap">${brl(earned)}</td>
    </tr>`;
  }).join("");
  return `<div class="card border border-stone-300 overflow-hidden">
    <div class="px-4 md:px-5 pt-4 pb-3 flex items-start justify-between gap-3 flex-wrap">

      <div class="flex items-center gap-3 text-[12px] font-bold">${TIERS.map(([, l, c]) => `<span class="inline-flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full" style="background:${c}"></i>${l}</span>`).join("")}</div>
    </div>

      <thead>
        <tr class="text-[10px] uppercase tracking-wider text-stone-500 bg-stone-50"><th class="pt-2 pl-4 text-left font-bold" rowspan="2">Loja</th><th colspan="3" class="pt-2 text-center font-bold border-b border-stone-200">Prêmio por semana</th><th class="w-3" rowspan="2"></th><th colspan="${weeks.length}" class="pt-2 text-center font-bold border-b border-stone-200">Prêmio conquistado</th><th class="pt-2 pr-4 text-right font-bold" rowspan="2">Total no mês</th></tr>

  </div>`;
}
function weekTierGoals(ym, stores, wi) {
  const ps = stores.map(st => planOf(ym, st));
  if (ps.some(p => !p?.weeks?.[wi])) return null;
  const sum = k => ps.every(p => p.weeks[wi][k]) ? ps.reduce((a, p) => a + p.weeks[wi][k], 0) : null;
  const prize = k => stores.length === 1 ? (ps[0].prizes?.[k] ?? null) : null;
  return { meta: sum("meta"), ouro: sum("ouro"), diamante: sum("diamante"), prizes: { meta: prize("meta"), ouro: prize("ouro"), diamante: prize("diamante") } };
}

function weekSummary(ym, stores, wi, wk, prevWk, tmG) {
  const fmt = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const tiers = weekTierGoals(ym, stores, wi) || { meta: wk.g, ouro: null, diamante: null, prizes: {} };
  const done = wk.lastDay >= wk.to || ym < TODAY_ISO.slice(0, 7);
  const lvl = tierOf(wk.v, tiers);
  const daysLeft = done ? 0 : wk.to - wk.lastDay;
  const tm = wk.t ? wk.v / wk.t : 0, tcDay = wk.n ? wk.t / wk.n : 0;
  const pTm = prevWk?.t ? prevWk.v / prevWk.t : null, pTc = prevWk?.n ? prevWk.t / prevWk.n : null;
  const arrow = (c, p) => p ? `<span class="${c >= p ? "text-emerald-700" : "text-rose-600"} font-bold">${c >= p ? "▲" : "▼"} ${pct(Math.abs(c / p - 1), 1)}</span>` : "";
  const ws = weekStats(ym, stores, wi);
  const proj = done ? wk.v : (ws.projection || 0);

}

    </tr>`);
    if (wk.any) body.push(weekSummary(ym, stores, wi, wk, prevWk, tmG));

  return `

function todayDayOf(ym) {
  const cur = TODAY_ISO.slice(0, 7);
  return ym === cur ? Number(TODAY_ISO.slice(8)) : ym < cur ? 99 : 0;
}
function defaultWeekIdx(ym) {
  const weeks = monthWeeks(ym), td = todayDayOf(ym);
  if (td === 99) return weeks.length - 1;
  const i = weeks.findIndex(w => td >= w.from && td <= w.to);
  return i < 0 ? 0 : i;
}
function selWeekIdx(ym) { const w = S.view.weekSel; const n = monthWeeks(ym).length; return w && w.ym === ym && w.i < n ? w.i : defaultWeekIdx(ym); }
function setWeekSel(i) { S.view.weekSel = { ym: S.view.month, i }; save(); renderHome(); }

function weekStats(ym, stores, wi) {
  const weeks = monthWeeks(ym), dim = daysInMonth(ym), w = weeks[wi], to = Math.min(w.to, dim);
  const td = todayDayOf(ym);
  let g = 0, v = 0, t = 0, gDone = 0, n = 0, last = 0;
  for (let d = w.from; d <= to; d++) {
    const gd = dayGoal(ym, d, stores), r = dayTotal(dateOf(ym, d), stores);
    g += gd; if (r) { v += r.v; t += r.t; gDone += gd; n++; last = d; }
  }
  const closed = to < td, future = w.from > td;
  const remaining = closed ? 0 : future ? to - w.from + 1 : to - td + 1;
  return { i: wi, from: w.from, to, g, v, t, n, last, gDone, closed, future, remaining,
    pct: g ? v / g : 0, expShare: g ? gDone / g : 0, diff: v - gDone,
    projection: gDone ? v / gDone * g : null, need: remaining ? Math.max(0, g - v) / remaining : 0 };
}
function weekStatus(w) {
  if (!w.g) return { tone: "stone", label: "Sem meta" };
  if (w.v >= w.g) return { tone: "emerald", label: w.closed ? "Meta atingida" : "Meta batida" };
  if (w.closed) return { tone: "rose", label: "Não atingida" };
  if (w.future || !w.n) return { tone: "stone", label: "A começar" };
  if (w.diff >= 0) return { tone: "emerald", label: "No ritmo" };
  if (w.diff >= -0.05 * w.gDone) return { tone: "amber", label: "Atenção" };
  return { tone: "rose", label: "Abaixo" };
}
function bar(p, e, color, tick, h = "h-4") {
  return `<div class="relative ${h} rounded-full bg-stone-200/70">
    <div class="absolute inset-y-0 left-0 rounded-full" style="width:${Math.min(100, p * 100)}%;background:${color}"></div>
    ${tick ? `<div class="absolute -top-1.5 -bottom-1.5 w-[3px] rounded bg-cb-ink" style="left:calc(${Math.min(100, e * 100)}% - 1.5px)" title="Onde deveria estar"></div>` : ""}
  </div>`;
}


function tmBoxes(w, tmG) {
  const box = (inner, cls = "bg-cb-bg border border-cb-line") => `<div class="rounded-xl ${cls} p-3.5">${inner}</div>`;
  const lbl = s => `<p class="text-[11px] font-bold uppercase tracking-wider text-stone-500">${s}</p>`;
  const tm = w.t ? w.v / w.t : 0;
  let out = "";
  // 1) Ticket médio x meta de TM
  if (w.t) {
    let line = `<p class="text-xs text-stone-500">${intf(w.t)} tickets · ${Math.round(w.t / w.n)} por dia</p>`;
    let sub = "";
    if (tmG) {
      const gap = tmG - tm, ok = gap <= 0;
      sub = ok
        ? `<p class="text-sm font-bold text-emerald-700">✓ ${money2(-gap)} acima da meta de TM (${money2(tmG)})</p>`
        : `<p class="text-sm font-bold text-rose-700">Falta ${money2(gap)} para a meta de TM (${money2(tmG)})</p>
           <p class="text-xs text-stone-500">${pct(tm / tmG)} da meta de TM</p>`;
    }
    out += box(`${lbl("Ticket médio da semana")}
      <p class="text-2xl font-extrabold tabular ${tmG ? (tm >= tmG ? "text-emerald-700" : "text-rose-700") : ""}">${money2(tm)}</p>${sub}${line}`);
  }
  // 2) Projeção: TC real x TM ideal
  if (tmG && w.g) {
    const tcNeed = Math.ceil(w.g / tmG);
    if (w.t && w.gDone && tm >= tmG && w.v < w.g) {
      // TM já está na meta: o que falta é fluxo (TC).
      const tcProj = w.closed ? w.t : Math.round(w.t / w.gDone * w.g);
      const tcNeedNow = Math.ceil(w.g / tm), short = tcNeedNow - tcProj;
      out += box(`${lbl(w.closed ? "TM na meta: faltou TC" : "TM na meta: foco em TC")}
        <p class="text-2xl font-extrabold tabular ${short > 0 ? "text-rose-700" : "text-emerald-700"}">${intf(tcNeedNow)} <span class="text-sm font-bold text-stone-500">TC necessários</span></p>
        <p class="text-xs font-semibold text-stone-600">com o TM atual de ${money2(tm)} · ${w.closed ? "fez" : "ritmo de"} ${intf(tcProj)} TC</p>
        <p class="text-xs text-stone-600 mt-1">${short > 0
          ? `${w.closed ? "Faltaram" : "Faltam"} <b>${intf(short)} TC</b> ${w.closed ? "" : `(${Math.ceil(short / Math.max(1, w.remaining))} a mais por dia nos ${w.remaining} dia(s) restantes)`} para bater a meta.`
          : "No ritmo atual de TC, bate a meta."}</p>`,
        "bg-white border-2 border-cb-bordo/25");
    } else if (w.t && w.gDone) {
      const tcProj = w.closed ? w.t : Math.round(w.t / w.gDone * w.g);
      const val = tcProj * tmG, pp = val / w.g, okp = val >= w.g;
      const pc = okp ? "text-emerald-700" : pp >= 0.95 ? "text-amber-700" : "text-rose-700";
      const gain = (w.closed ? val - w.v : val - (w.projection || 0));
      out += box(`${lbl(w.closed ? "Se o TM estivesse na meta" : "Projeção com TM na meta")}
        <p class="text-2xl font-extrabold tabular ${pc}">${money(val)}</p>
        <p class="text-xs font-semibold ${pc}">${pct(pp)} da meta · ${intf(tcProj)} TC ${w.closed ? "reais" : "projetados"} × ${money2(tmG)}</p>
        <p class="text-xs text-stone-600 mt-1">${okp
          ? `${w.closed ? "Teria batido" : "Bate"} a meta da semana${gain > 0 ? ` (+${money(gain)} vs ${w.closed ? "o realizado" : "a projeção atual"})` : ""}.`
          : `Mesmo com TM na meta, ${w.closed ? "faltariam" : "faltam"} ${money(w.g - val)}: é preciso ${intf(tcNeed)} TC na semana (${w.closed ? "fez" : "ritmo de"} ${intf(tcProj)}).`}</p>`,
        "bg-white border-2 border-cb-bordo/25");
    } else {
      const days = w.to - w.from + 1;
      out += box(`${lbl("TC necessário com TM na meta")}
        <p class="text-2xl font-extrabold tabular">${intf(tcNeed)} <span class="text-sm font-bold text-stone-500">TC</span></p>
        <p class="text-xs text-stone-600">${Math.ceil(tcNeed / days)} por dia × ${money2(tmG)} = ${money(w.g)}</p>`,
        "bg-white border-2 border-cb-bordo/25");
    }
  }
  return out;
}

// ======================= DASHBOARD DE VENDAS =======================
const DASH_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4"]; // fixo por loja (ordem de STORES)
const DASH_MIN = "2026-01-01";
const INK = "#1C1917", MUTED = "#78716c", GRID = "#e7e5e4", BORDO = "#4A0E17";
function storeColor(st) { return DASH_COLORS[STORES.indexOf(st)] || "#888"; }
function addDays(isoDate, n) { const d = new Date(isoDate + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); }
function ddmm(isoDate) { return isoDate.slice(8, 10) + "/" + isoDate.slice(5, 7); }
function moneyK(v) {
  const n = Number(v) || 0, a = Math.abs(n);
  if (a >= 1000) return "R$ " + (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: a >= 100000 ? 0 : 1 }) + " mil";
  return "R$ " + Math.round(n).toLocaleString("pt-BR");
}
function lastSaleDate(stores) {
  let last = DASH_MIN;
  Object.keys(S.sales).forEach(d => { if (d > last && d < TODAY_ISO && stores.some(s => S.sales[d][s])) last = d; });
  return last;
}
function dashState() {
  S.view.dash ||= {};
  const D = S.view.dash, ym = S.view.month;
  if (D.ym !== ym) { D.ym = ym; D.preset = "month"; D.from = D.to = null; }
  D.stores = (D.stores || []).filter(s => visibleStores().includes(s));
  if (!D.stores.length && S.view.store && visibleStores().includes(S.view.store) && visibleStores().length > 1 && D.init !== ym) D.stores = [S.view.store];
  D.init = ym;
  return D;
}
function dashStores(D) { const vs = visibleStores(), sel = D.stores.filter(s => vs.includes(s)); return sel.length ? sel : vs.slice(); }
function dashRange(D) {
  const ym = D.ym, dim = daysInMonth(ym);
  if (D.preset === "month") return [dateOf(ym, 1), dateOf(ym, dim)];
  if (D.preset?.[0] === "w") { const w = monthWeeks(ym)[+D.preset.slice(1)]; return [dateOf(ym, w.from), dateOf(ym, Math.min(w.to, dim))]; }
  if (D.preset === "7d") { const end = lastSaleDate(dashStores(D)); return [addDays(end, -6), end]; }
  let f = D.from || dateOf(ym, 1), t = D.to || dateOf(ym, dim);
  if (f < DASH_MIN) f = DASH_MIN;
  if (t < f) [f, t] = [t, f];
  return [f, t];
}
function setDash(k, v) {
  const D = dashState();
  if (k === "preset") { if (v === "custom") { const [f, t] = dashRange(D); D.from = f; D.to = t; } D.preset = v; }
  else if (k === "from" || k === "to") { D[k] = v; D.preset = "custom"; }
  else if (k === "store") {
    if (v === "") D.stores = [];
    else { const i = D.stores.indexOf(v); if (i >= 0) D.stores.splice(i, 1); else D.stores.push(v); if (D.stores.length === visibleStores().length) D.stores = []; }
  }
  save(); renderHome();
}

function dashData(from, to, stores) {
  const last = lastSaleDate(stores);
  const rows = [];
  const by = Object.fromEntries(stores.map(s => [s, { s, g: 0, gDone: 0, v: 0, t: 0, n: 0, tmW: 0 }]));
  const tot = { g: 0, gDone: 0, v: 0, t: 0, n: 0, hit: 0, future: 0 };
  const dow = Array.from({ length: 7 }, (_, i) => ({ i, v: 0, g: 0, n: 0, t: 0 }));
  const weeks = [];
  for (let date = from; date <= to; date = addDays(date, 1)) {
    const ym = date.slice(0, 7), d = Number(date.slice(8)), wd = new Date(date + "T12:00:00").getDay();
    const row = { date, ym, d, wd, g: 0, v: 0, t: 0, has: false, by: {} };
    stores.forEach(s => {
      const g = dayGoal(ym, d, [s]), x = S.sales[date]?.[s];
      row.by[s] = { g, v: x?.v || 0, t: x?.t || 0, has: !!x };
      row.g += g; by[s].g += g;
      if (x) { row.v += x.v; row.t += x.t; row.has = true; by[s].v += x.v; by[s].t += x.t; by[s].gDone += g; by[s].n++; }
    });
    tot.g += row.g;
    if (row.has) {
      tot.v += row.v; tot.t += row.t; tot.n++;
      tot.gDone += stores.reduce((a, s) => a + (row.by[s].has ? row.by[s].g : 0), 0);
      if (row.v >= row.g) tot.hit++;
      const w = dow[wd]; w.v += row.v; w.g += row.g; w.t += row.t; w.n++;
    } else if (date > last) tot.future++;
    // semana do mês
    const wi = monthWeeks(ym).findIndex(w => d >= w.from && d <= w.to);
    const key = ym + ":" + wi;
    let wk = weeks.find(x => x.key === key);
    if (!wk) { wk = { key, ym, wi, label: `S${wi + 1} ${MONTHS[Number(ym.slice(5)) - 1].slice(0, 3)}`, from: d, to: d, by: Object.fromEntries(stores.map(s => [s, { v: 0, gDone: 0, g: 0 }])), v: 0, gDone: 0, g: 0 }; weeks.push(wk); }
    wk.to = d;
    stores.forEach(s => { const b = row.by[s]; wk.by[s].g += b.g; wk.g += b.g; if (b.has) { wk.by[s].v += b.v; wk.by[s].gDone += b.g; wk.v += b.v; wk.gDone += b.g; } });
    rows.push(row);
  }
  const ymRef = to.slice(0, 7);
  stores.forEach(s => { by[s].tmG = tmGoalOf(ymRef, s); });
  const withTm = stores.filter(s => by[s].tmG);
  tot.tmG = withTm.length === stores.length && tot.g ? stores.reduce((a, s) => a + by[s].g, 0) / stores.reduce((a, s) => a + by[s].g / by[s].tmG, 0) : null;
  const proj = x => x.gDone ? (x.v / x.gDone) * x.g : 0;
  tot.proj = tot.future ? proj(tot) : tot.v;
  stores.forEach(s => { by[s].proj = tot.future ? proj(by[s]) : by[s].v; });
  return { rows, by, tot, dow, weeks, last, stores };
}

// ---------- tooltip ----------
let DASH_TIPS = [];
function tipId(html) { DASH_TIPS.push(html); return DASH_TIPS.length - 1; }
function tipRow(color, label, value, line = false) {
  return `<div class="flex items-center justify-between gap-4"><span class="flex items-center gap-1.5 text-stone-300">${color ? `<i class="inline-block ${line ? "w-3 h-[2px]" : "w-2.5 h-2.5 rounded-sm"}" style="background:${color}"></i>` : ""}${label}</span><b class="tabular text-white">${value}</b></div>`;
}
(function initDashTip() {
  const show = e => {
    const el = e.target.closest?.("[data-tip]"); const tip = document.getElementById("viz-tip");
    if (!tip) return;
    if (!el) { tip.style.opacity = 0; return; }
    tip.innerHTML = DASH_TIPS[+el.dataset.tip] || ""; tip.style.opacity = 1;
    const r = tip.getBoundingClientRect(), pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  };
  document.addEventListener("pointermove", show);
  document.addEventListener("pointerdown", show);
  document.addEventListener("scroll", () => { const t = document.getElementById("viz-tip"); if (t) t.style.opacity = 0; }, true);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view.tab === "home" && S.view.detail === true) drawDashCharts(); else if (S.view.tab === "home" && S.view.detail === "fid") drawFidChart(); else if (S.view.tab === "home" && S.view.detail === "nps") drawNpsDayChart(); }, 150); });
})();

// ---------- escalas / eixos ----------
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return ([1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10].find(s => m <= s)) * p; }
function yAxis(W, m, h, max, fmt = moneyK, ticks = 4) {
  let s = "";
  for (let i = 0; i <= ticks; i++) {
    const v = max * i / ticks, y = m.t + h - h * i / ticks;
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="${i ? GRID : "#a8a29e"}" stroke-width="1" ${i ? 'stroke-dasharray="2 3"' : ""}/>`;
    s += `<text x="${m.l - 8}" y="${y + 4}" text-anchor="end" class="ax">${fmt(v)}</text>`;
  }
  return s;
}
function roundTop(x, y, w, h, r) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
function roundRight(x, y, w, h, r) {
  if (w <= 0) return "";
  r = Math.min(r, h / 2, w);
  return `M${x},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x} Z`;
}

// ---------- gráficos ----------
function chartDaily(W, X) {
  const H = 280, m = { l: 62, r: 14, t: 16, b: 34 }, h = H - m.t - m.b, w = W - m.l - m.r;
  const rows = X.rows, n = rows.length, band = w / n, bw = Math.max(3, Math.min(34, band * 0.66));
  const lyMax = Math.max(0, ...rows.map(r => X.stores.reduce((a, st) => a + (histOf(lyDate(r.date), st)?.v || 0), 0)));
  const max = niceMax(Math.max(...rows.map(r => Math.max(r.v, r.g)), lyMax, 1) * 1.05);
  const y = v => m.t + h - h * v / max;
  let s = yAxis(W, m, h, max);
  const multi = X.stores.length > 1;
  rows.forEach((r, i) => {
    const cx = m.l + band * i + band / 2, x0 = cx - bw / 2;
    if (r.has) {
      let acc = 0;
      const segs = X.stores.filter(st => r.by[st].v > 0);
      segs.forEach((st, j) => {
        const v = r.by[st].v, y1 = y(acc + v), y0 = y(acc), top = j === segs.length - 1;
        const hh = Math.max(0, y0 - y1 - (top ? 0 : 2));
        const color = multi ? storeColor(st) : BORDO;
        s += top ? `<path d="${roundTop(x0, y1, bw, hh, 4)}" fill="${color}"/>` : `<rect x="${x0}" y="${y1 + 2}" width="${bw}" height="${hh}" fill="${color}"/>`;
        acc += v;
      });
    }
    const label = (n <= 16 || i % 2 === 0 || i === n - 1);
    if (label) s += `<text x="${cx}" y="${H - m.b + 16}" text-anchor="middle" class="ax ${r.wd === 0 || r.wd === 6 ? "wk" : ""}">${r.d}</text>`;
    if (n <= 16 || r.d === 1 || i === 0) s += `<text x="${cx}" y="${H - m.b + 28}" text-anchor="middle" class="ax2">${n <= 16 ? WD[r.wd] : MONTHS[Number(r.ym.slice(5)) - 1].slice(0, 3)}</text>`;
  });
  // meta (degraus)
  let p = "";
  rows.forEach((r, i) => { const x0 = m.l + band * i + 2, x1 = m.l + band * (i + 1) - 2; p += `${i ? "L" : "M"}${x0},${y(r.g)} L${x1},${y(r.g)} `; });
  s += `<path d="${p}" fill="none" stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 3"/>`;
  // ano anterior (mesmo dia da semana)
  const lyv = rows.map(r => X.stores.reduce((a, st) => a + (histOf(lyDate(r.date), st)?.v || 0), 0));
  if (lyv.some(v => v > 0)) s += `<path d="${lyv.map((v, i) => `${i ? "L" : "M"}${m.l + band * i + band / 2},${y(v)}`).join(" ")}" fill="none" stroke="#78716c" stroke-width="2" stroke-linejoin="round"/>` + lyv.map((v, i) => `<circle cx="${m.l + band * i + band / 2}" cy="${y(v)}" r="3" fill="#fff" stroke="#78716c" stroke-width="1.5"/>`).join("");
  // hover
  rows.forEach((r, i) => {
    const diff = r.v - r.g;
    const tip = `<p class="text-[11px] text-stone-400 mb-1">${WD[r.wd]}, ${ddmm(r.date)}</p>` +
      (r.has ? tipRow(null, "Realizado", money(r.v)) + tipRow(INK === "" ? null : "#fff", "Meta do dia", money(r.g), true) +
        `<div class="flex justify-between gap-4"><span class="text-stone-300">Diferença</span><b class="${diff >= 0 ? "text-emerald-300" : "text-rose-300"}">${diff >= 0 ? "+" : "−"}${money(Math.abs(diff))} (${pct(r.g ? r.v / r.g : 0)})</b></div>` +
        tipRow(null, "TC · TM", `${intf(r.t)} · ${r.t ? money2(r.v / r.t) : "—"}`) +
        (() => { const lv = X.stores.reduce((a, st) => a + (r.by[st].has ? histOf(lyDate(r.date), st)?.v || 0 : 0), 0); return lv ? tipRow("#a8a29e", `2025 (${ddmm(lyDate(r.date))})`, `${money(lv)} · ${r.v >= lv ? "+" : ""}${pct(r.v / lv - 1, 1)}`, true) : ""; })() +
        (multi ? `<div class="mt-1.5 pt-1.5 border-t border-white/15 space-y-0.5">${X.stores.filter(st => r.by[st].has).map(st => tipRow(storeColor(st), shortStore(st), money(r.by[st].v))).join("")}</div>` : "")
        : tipRow("#fff", "Meta do dia", money(r.g), true) + `<p class="text-stone-400 text-[11px] mt-1">${r.date >= TODAY_ISO ? "Ainda não vendido" : "Sem informe"}</p>`);
    s += `<rect class="hit" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${h}" data-tip="${tipId(tip)}"/>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="Faturamento diário e meta do dia">${s}</svg>`;
}

function chartCumulative(W, X) {
  const H = 300, m = { l: 62, r: 96, t: 16, b: 30 }, h = H - m.t - m.b, w = W - m.l - m.r;
  const rows = X.rows, n = rows.length;
  let cg = 0, cv = 0; const pts = rows.map(r => { cg += r.g; if (r.has) cv += r.v; return { r, cg, cv }; });
  const lastIdx = rows.reduce((a, r, i) => r.has ? i : a, -1);
  const max = niceMax(Math.max(cg, X.tot.proj, cv) * 1.05);
  const x = i => m.l + (n === 1 ? w / 2 : w * i / (n - 1)), y = v => m.t + h - h * v / max;
  let s = yAxis(W, m, h, max);
  [0, Math.floor((n - 1) / 2), n - 1].forEach(i => { s += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" class="ax">${ddmm(rows[i].date)}</text>`; });
  s += `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.cg)}`).join(" ")}" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="5 3"/>`;
  if (lastIdx >= 0) {
    const real = pts.slice(0, lastIdx + 1);
    s += `<path d="${real.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.cv)}`).join(" ")} L${x(lastIdx)},${y(0)} L${x(0)},${y(0)} Z" fill="${BORDO}" opacity=".07"/>`;
    s += `<path d="${real.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.cv)}`).join(" ")}" fill="none" stroke="${BORDO}" stroke-width="2.5" stroke-linejoin="round"/>`;
    if (lastIdx < n - 1) s += `<path d="M${x(lastIdx)},${y(pts[lastIdx].cv)} L${x(n - 1)},${y(X.tot.proj)}" stroke="${BORDO}" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" fill="none"/>`;
    s += `<circle cx="${x(lastIdx)}" cy="${y(pts[lastIdx].cv)}" r="5" fill="${BORDO}" stroke="#fff" stroke-width="2"/>`;
  }
  // rótulos diretos no fim
  const lab = (yy, t1, t2, c) => `<text x="${W - m.r + 8}" y="${yy}" class="lb" fill="${c}">${t1}</text><text x="${W - m.r + 8}" y="${yy + 13}" class="ax">${t2}</text>`;
  const yMeta = y(cg), yProj = y(lastIdx < n - 1 ? X.tot.proj : cv);
  const apart = Math.abs(yMeta - yProj) < 28 ? (yMeta < yProj ? [-14, 14] : [14, -14]) : [0, 0];
  s += lab(yMeta + apart[0], "Meta", moneyK(cg), INK);
  if (lastIdx >= 0) s += lab(yProj + apart[1], lastIdx < n - 1 ? "Projeção" : "Realizado", moneyK(lastIdx < n - 1 ? X.tot.proj : cv), BORDO);
  pts.forEach((p, i) => {
    const bx = n === 1 ? m.l : x(i) - w / (n - 1) / 2, bwid = n === 1 ? w : w / (n - 1);
    const tip = `<p class="text-[11px] text-stone-400 mb-1">Acumulado até ${ddmm(p.r.date)}</p>` +
      (i <= lastIdx ? tipRow(BORDO === "" ? null : "#e8a0aa", "Realizado", money(p.cv), true) : "") +
      tipRow("#fff", "Meta", money(p.cg), true) + (i <= lastIdx ? tipRow(null, "Atingimento", pct(p.cg ? p.cv / p.cg : 0)) : "");
    s += `<g class="hb"><line class="cx" x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t + h}"/><rect class="hit0" x="${Math.max(m.l, bx)}" y="${m.t}" width="${bwid}" height="${h}" data-tip="${tipId(tip)}"/></g>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="Faturamento acumulado contra a meta">${s}</svg>`;
}

function labelW(names) { return Math.min(190, Math.max(...names.map(n => n.length)) * 7.4 + 18); }
function chartStores(W, X) {
  const list = X.stores.map(s => X.by[s]).sort((a, b) => (b.gDone ? b.v / b.gDone : 0) - (a.gDone ? a.v / a.gDone : 0));
  const rowH = 46, m = { l: labelW(list.map(b => shortStore(b.s))), r: 150, t: 18, b: 8 }, H = m.t + m.b + rowH * list.length, w = W - m.l - m.r;
  const maxP = Math.max(1.2, ...list.map(b => b.gDone ? b.v / b.gDone : 0)) * 1.02;
  const x = p => m.l + w * p / maxP;
  let s = `<line x1="${x(1)}" x2="${x(1)}" y1="${m.t - 10}" y2="${H - m.b}" stroke="${INK}" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x(1)}" y="${m.t - 12}" text-anchor="middle" class="ax">100% da meta</text>`;
  list.forEach((b, i) => {
    const p = b.gDone ? b.v / b.gDone : 0, y0 = m.t + i * rowH + 10, bh = 16;
    s += `<text x="${m.l - 10}" y="${y0 + 12}" text-anchor="end" class="lb">${esc(shortStore(b.s))}</text>`;
    s += `<rect x="${m.l}" y="${y0}" width="${w}" height="${bh}" rx="4" fill="#f5f5f4"/>`;
    s += `<path d="${roundRight(m.l, y0, Math.max(2, x(p) - m.l), bh, 4)}" fill="${storeColor(b.s)}"/>`;
    s += `<text x="${W - m.r + 10}" y="${y0 + 8}" class="lb tabular">${pct(p)}</text><text x="${W - m.r + 10}" y="${y0 + 22}" class="ax">${moneyK(b.v)} de ${moneyK(b.gDone)}</text>`;
    const tip = `<p class="text-[11px] text-stone-400 mb-1">${esc(shortStore(b.s))}</p>` + tipRow(storeColor(b.s), "Realizado", money(b.v)) + tipRow(null, "Meta dos dias vendidos", money(b.gDone)) + tipRow(null, "Atingimento", pct(p, 1)) + tipRow(null, "Meta do período", money(b.g)) + tipRow(null, "Projeção", `${money(b.proj)} (${pct(b.g ? b.proj / b.g : 0)})`);
    s += `<rect class="hit" x="0" y="${y0 - 8}" width="${W}" height="${rowH - 4}" data-tip="${tipId(tip)}"/>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="Atingimento da meta por loja">${s}</svg>`;
}

function chartTm(W, X) {
  const list = X.stores.map(s => ({ ...X.by[s], tm: X.by[s].t ? X.by[s].v / X.by[s].t : 0 })).filter(b => b.t).sort((a, b) => b.tm - a.tm);
  if (!list.length) return `<p class="text-sm text-stone-500 py-8 text-center">Sem tickets no período.</p>`;
  const rowH = 44, m = { l: labelW(list.map(b => shortStore(b.s))), r: 140, t: 22, b: 26 }, H = m.t + m.b + rowH * list.length, w = W - m.l - m.r;
  const vals = list.flatMap(b => [b.tm, b.tmG || b.tm]);
  const lo = Math.floor(Math.min(...vals) * 0.92 / 5) * 5, hi = Math.ceil(Math.max(...vals) * 1.04 / 5) * 5;
  const x = v => m.l + w * (v - lo) / (hi - lo || 1);
  let s = "";
  for (let v = lo; v <= hi; v += 5) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t - 6}" y2="${H - m.b}" stroke="${GRID}" stroke-dasharray="2 3"/><text x="${x(v)}" y="${H - 8}" text-anchor="middle" class="ax">${v}</text>`;
  list.forEach((b, i) => {
    const yc = m.t + i * rowH + rowH / 2 - 4;
    s += `<text x="${m.l - 10}" y="${yc + 4}" text-anchor="end" class="lb">${esc(shortStore(b.s))}</text>`;
    if (b.tmG) {
      s += `<line x1="${x(Math.min(b.tm, b.tmG))}" x2="${x(Math.max(b.tm, b.tmG))}" y1="${yc}" y2="${yc}" stroke="#d6d3d1" stroke-width="3" stroke-linecap="round"/>`;
      s += `<line x1="${x(b.tmG)}" x2="${x(b.tmG)}" y1="${yc - 9}" y2="${yc + 9}" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
    }
    s += `<circle cx="${x(b.tm)}" cy="${yc}" r="7" fill="${storeColor(b.s)}" stroke="#fff" stroke-width="2"/>`;
    const d = b.tmG ? b.tm - b.tmG : null;
    s += `<text x="${W - m.r + 10}" y="${yc}" class="lb tabular">${money2(b.tm)}</text><text x="${W - m.r + 10}" y="${yc + 14}" class="ax">${b.tmG ? `meta ${money2(b.tmG)} · <tspan class="${d >= 0 ? "pos" : "neg"}">${d >= 0 ? "+" : "−"}${money2(Math.abs(d)).replace("R$", "").trim()}</tspan>` : "sem meta de TM"}</text>`;
    const tip = `<p class="text-[11px] text-stone-400 mb-1">${esc(shortStore(b.s))}</p>` + tipRow(storeColor(b.s), "Ticket médio", money2(b.tm)) + (b.tmG ? tipRow("#fff", "Meta de TM", money2(b.tmG), true) : "") + tipRow(null, "Tickets", `${intf(b.t)} (${Math.round(b.t / (b.n || 1))}/dia)`);
    s += `<rect class="hit" x="0" y="${yc - rowH / 2 + 2}" width="${W}" height="${rowH - 4}" data-tip="${tipId(tip)}"/>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="Ticket médio por loja contra a meta de TM">${s}</svg>`;
}

function chartWeekday(W, X) {
  const order = [1, 2, 3, 4, 5, 6, 0], data = order.map(i => X.dow[i]);
  const H = 280, m = { l: 62, r: 12, t: 26, b: 30 }, h = H - m.t - m.b, w = W - m.l - m.r, band = w / 7, bw = Math.min(46, band * 0.6);
  const avg = d => d.n ? d.v / d.n : 0, avgG = d => d.n ? d.g / d.n : 0;
  const max = niceMax(Math.max(...data.map(d => Math.max(avg(d), avgG(d))), 1) * 1.1);
  const y = v => m.t + h - h * v / max;
  let s = yAxis(W, m, h, max);
  data.forEach((d, i) => {
    const cx = m.l + band * i + band / 2;
    s += `<text x="${cx}" y="${H - 10}" text-anchor="middle" class="ax ${d.i === 0 || d.i === 6 ? "wk" : ""}">${WD[d.i]}</text>`;
    if (!d.n) return;
    s += `<path d="${roundTop(cx - bw / 2, y(avg(d)), bw, y(0) - y(avg(d)), 4)}" fill="${BORDO}"/>`;
    s += `<line x1="${cx - bw / 2 - 5}" x2="${cx + bw / 2 + 5}" y1="${y(avgG(d))}" y2="${y(avgG(d))}" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
    const p = d.g ? d.v / d.g : 0;
    s += `<text x="${cx}" y="${Math.min(y(avg(d)), y(avgG(d))) - 8}" text-anchor="middle" class="lb tabular ${p >= 1 ? "pos" : "neg"}">${pct(p)}</text>`;
    const tip = `<p class="text-[11px] text-stone-400 mb-1">${WD[d.i]} · ${d.n} dia(s)</p>` + tipRow(BORDO === "" ? null : "#e8a0aa", "Média vendida", money(avg(d))) + tipRow("#fff", "Meta média", money(avgG(d)), true) + tipRow(null, "Atingimento", pct(p, 1)) + tipRow(null, "TM", d.t ? money2(d.v / d.t) : "—");
    s += `<rect class="hit" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${h}" data-tip="${tipId(tip)}"/>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="Média de venda por dia da semana">${s}</svg>`;
}

function heatColor(p) {
  // divergente: vermelho (abaixo) · cinza neutro em 100% · verde (acima)
  const mix = (a, b, t) => "#" + [0, 2, 4].map(i => Math.round(parseInt(a.slice(1 + i, 3 + i), 16) * (1 - t) + parseInt(b.slice(1 + i, 3 + i), 16) * t).toString(16).padStart(2, "0")).join("");
  const mid = "#f1efed";
  if (p >= 1) return mix(mid, "#16855f", Math.min(1, (p - 1) / 0.2));
  return mix(mid, "#c2362f", Math.min(1, (1 - p) / 0.3));
}
function heatmapHtml(X) {

    return `<td class="p-1"><div data-tip="${tipId(tip)}" class="h-12 rounded-md flex flex-col items-center justify-center cursor-default hover:ring-2 hover:ring-cb-ink/40 ${dark ? "text-white" : "text-cb-ink"}" style="background:${bg}"><b class="text-sm tabular">${pct(p)}</b><span class="text-[10px] tabular opacity-80">${moneyK(v)}</span></div></td>`;

  return `<div class="overflow-x-auto -mx-1"><table class="w-full border-separate" style="border-spacing:0"><thead><tr><th></th>${head}</tr></thead><tbody>${body}${total}</tbody></table></div>${legend}`;
}

const LOY_FIELDS = ["acum", "exp", "resg", "est", "saldo", "vendas", "fid"];
function fidGoalOf(st) { const g = S.fidGoals?.stores?.[st]; return g != null ? g : (S.fidGoals?.default ?? 50); }
function fidGoalFor(stores, by) {
  const tv = stores.reduce((a, s) => a + (by?.[s]?.vendas || 0), 0);
  if (!tv) return stores.reduce((a, s) => a + fidGoalOf(s), 0) / stores.length;

function looksLikeLoyalty(text) { return /EXTRATO DE CASHBACK/i.test(text) && /VENDAS FIDELIZADAS/i.test(text); }
function parseLoyalty(text) {
  const doc = new DOMParser().parseFromString(text, "text/html");
  const rows = [...doc.querySelectorAll("tr")].map(tr => [...tr.children].map(td => td.textContent.replace(/\s+/g, " ").trim()));
  const flat = rows.map(r => r.join(" ")).join("\n");
  const pm = flat.match(/PER[ÍI]ODO DE:?\s*(\d{2})\/(\d{2})\/(\d{4})\s*AT[ÉE]:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if (!pm) return { error: "Não encontrei o período (PERÍODO DE … ATÉ …) no arquivo." };
  const from = `${pm[3]}-${pm[2]}-${pm[1]}`, to = `${pm[6]}-${pm[5]}-${pm[4]}`;
  const hi = rows.findIndex(r => r.some(c => /CASHBACK ACUMULADO/i.test(c)));
  if (hi < 0) return { error: "Não encontrei o cabeçalho das colunas." };
  const H = rows[hi].map(c => c.toUpperCase());
  const col = re => H.findIndex(c => re.test(c));
  const ci = { sig: col(/^SIGLA/), fil: col(/^FILIAL/), acum: col(/ACUMULADO/), exp: col(/EXPIRADO/), resg: col(/RESGATADO/), est: col(/ESTORNADO/), saldo: col(/^SALDO/), vendas: col(/^QTDE DE VENDAS$/), fid: col(/QTDE DE VENDAS FIDELIZADAS/) };

  const out = {}, unknown = [];
  rows.slice(hi + 1).forEach(r => {
    if (r.length < H.length - 1 || /TOTAL/i.test(r[0])) return;
    const name = (r[ci.fil] || "").toUpperCase();
    const st = LOY_SIGLAS[(r[ci.sig] || "").toUpperCase()] || STORES.find(s => s.toUpperCase() === name) || STORES.find(s => name.includes(s.toUpperCase().replace(/^CB /, "")));

}

// Separa os extratos em períodos sem sobreposição (diário quando possível).
function loyaltyBuckets() {
  const imps = (S.loyalty || []).slice().sort((a, b) => a.from.localeCompare(b.from) || a.to.localeCompare(b.to));
  const span = b => (new Date(b.to) - new Date(b.from)) / 864e5;
  const cands = [];
  imps.forEach(im => {
    cands.push({ from: im.from, to: im.to, rows: im.rows });
    const prev = imps.filter(p => p.from === im.from && p.to < im.to).pop();
    if (prev) {
      const rows = {};
      Object.keys(im.rows).forEach(s => { const a = im.rows[s], b = prev.rows[s]; if (b) rows[s] = Object.fromEntries(LOY_FIELDS.map(k => [k, a[k] - b[k]])); });
      cands.push({ from: addDays(prev.to, 1), to: im.to, rows, derived: true });
    }
  });
  cands.sort((a, b) => span(a) - span(b) || (a.derived ? 1 : 0) - (b.derived ? 1 : 0));
  const chosen = [];
  cands.forEach(c => { if (!chosen.some(x => !(c.to < x.from || c.from > x.to))) chosen.push(c); });
  return chosen.sort((a, b) => a.from.localeCompare(b.from));
}
function loySum(buckets, stores) {

  const tot = z(), by = Object.fromEntries(stores.map(s => [s, z()]));
  buckets.forEach(b => stores.forEach(s => { const x = b.rows[s]; if (!x) return; LOY_FIELDS.forEach(k => { tot[k] += x[k]; by[s][k] += x[k]; }); }));
  return { tot, by };
}
function loyWeeks(buckets, stores) {
  const groups = [];
  buckets.forEach(b => {
    const ym = b.from.slice(0, 7), wks = monthWeeks(ym), d1 = Number(b.from.slice(8)), d2 = Number(b.to.slice(8));
    const wi = wks.findIndex(w => d1 >= w.from && d1 <= w.to);
    const one = b.to.slice(0, 7) === ym && wi >= 0 && d2 <= wks[wi].to;
    const key = one ? `${ym}:${wi}` : `${b.from}:${b.to}`;
    let g = groups.find(x => x.key === key);
    if (!g) { g = { key, ym, from: b.from, to: b.to, buckets: [], label: one ? `Semana ${wi + 1}` : "Período", sub: one ? `${wks[wi].from}–${Math.min(wks[wi].to, daysInMonth(ym))}/${ym.slice(5)}` : `${ddmm(b.from)}–${ddmm(b.to)}` }; groups.push(g); }

}

function csvParse(text) {

    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }

    const m = (r[I.at] || "").match(/(\d{2})\/(\d{2})\/(\d{2,4})\D+(\d{2}):(\d{2})/);

    if (n <= 16) s += `<text x="${cx}" y="${y(d.n) - 6}" text-anchor="middle" class="ax" style="font-size:10px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px">${d.n}</text>`;
    s += `<text x="${cx}" y="${H - m.b + 15}" text-anchor="middle" class="ax ${wd === 0 || wd === 6 ? "wk" : ""}">${Number(d.date.slice(8))}</text><text x="${cx}" y="${H - m.b + 26}" text-anchor="middle" class="ax2">${WD[wd]}</text>`;
    gp += `${i ? "L" : "M"}${m.l + band * i + 2},${y(d.g)} L${m.l + band * (i + 1) - 2},${y(d.g)} `;
    const tip = `<p class="text-[11px] text-stone-400 mb-1">${WD[wd]}, ${ddmm(d.date)}${d.date === TODAY_ISO ? " (parcial)" : ""}</p>` + tipRow(null, "Avaliações", intf(d.n)) + tipRow("#fff", "Meta diária", dec1(d.g), true) + tipRow(null, d.n >= d.g ? "Acima" : "Faltou", dec1(Math.abs(d.n - d.g)));

const AGREE = { 5: "Concordo totalmente", 4: "Concordo parcialmente", 3: "Não concordo nem discordo", 2: "Discordo parcialmente", 1: "Discordo totalmente" };

function npsLabel(k) { return S.npsLabels?.[k] || NPS_Q[k]?.short || k; }
function npsZone(v) {

const npsAvg = v => v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;

// ---------- Comparativo por loja ----------
function cmpStacked(qk, list, stores, sortKey) {
  const opts = NPS_Q[qk].opts, keys = Object.keys(opts);

  rows.sort((a, b) => b.c[sortKey || keys[0]] / b.n - a.c[sortKey || keys[0]] / a.n);
  const total = list.filter(x => x[qk] && stores.includes(x.s)).length;

      <span class="text-[11px] text-stone-500 tabular text-right">${intf(r.n)} respostas</span></div>`).join("")}</div>
  </div>`;
}
function cmpScale(qk, list, stores, labels) {

// ---------- Lista de respostas ----------
function setNpsF(k, v) { S.view.npsF ||= {}; if (v === "" || v == null || v === false) delete S.view.npsF[k]; else S.view.npsF[k] = v; S.view.npsLimit = 30; save(); renderHome(); }
function npsFilterFn(F) {

    for (const k of ["q3", "q4", "q5", "q6", "q7"]) if (F[k] && x[k] !== Number(F[k])) return false;
    if (F.q8 && x.q8 !== F.q8) return false;

let JSPDF_P = null;
function loadJsPdf() {
  if (window.jspdf?.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  return JSPDF_P ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload = () => res(window.jspdf.jsPDF); s.onerror = () => { JSPDF_P = null; rej(new Error("load")); }; document.head.appendChild(s); });
}
function weekReportData(ym, wi, stores) {
  const w = monthWeeks(ym)[wi], to = Math.min(w.to, daysInMonth(ym)), from = dateOf(ym, w.from), toD = dateOf(ym, to);
  const npsAll = Object.values(S.nps?.resp || {}).filter(x => x.d >= from && x.d <= toD);
  const loyB = (typeof loyaltyBuckets === "function" ? loyaltyBuckets() : []).filter(b => b.from >= from && b.to <= toD);
  const row = ss => {
    const st = weekStats(ym, ss, wi), tm = st.t ? st.v / st.t : null;
    const nl = npsAll.filter(x => ss.includes(x.s)), nc = npsCalc(nl), cnt = nl.filter(x => x.q1).length;
    const cntG = ss.reduce((a, s) => a + npsCountGoal(s) / daysInMonth(ym) * (to - w.from + 1), 0);
    const ly = loyB.length ? loySum(loyB, ss).tot : null, fid = ly?.vendas ? ly.fid / ly.vendas : null;
    const fidG = fidGoalFor(ss, loyB.length ? loySum(loyB, ss).by : null) / 100;
    const tmG = tmGoalFor(ym, ss);
    return { v: st.v, g: st.g, gDone: st.gDone, att: st.gDone ? st.v / st.gDone : null, weekPct: st.g ? st.v / st.g : null, proj: st.closed ? st.v : st.projection, t: st.t, tm, tmG,
      n: st.n, closed: st.closed, cnt, cntG, nps: nc.n ? nc.nps : null, npsG: npsScoreGoalFor(ss), fid, fidG, fidDays: loyB.length };
  };
  const last = stores.reduce((a, s) => Math.max(a, weekStats(ym, [s], wi).last || 0), 0);
  return { ym, wi, w: { from: w.from, to }, from, toD, last, rows: stores.map(s => ({ s, ...row([s]) })), tot: row(stores) };
}

function weekWhatsText() {
  const ym = S.view.month, wi = selWeekIdx(ym), stores = visibleStores(), R = weekReportData(ym, wi, stores), mm = ym.slice(5);
  const p2 = n => String(n).padStart(2, "0");
  const pc = (v, d = 0) => v == null ? "-" : (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
  const k = v => "R$ " + ((v || 0) / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
  const tm = v => v == null ? "-" : v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const dot = a => a == null ? "⚪" : a >= 1 ? "🟢" : a >= 0.95 ? "🟡" : "🔴";
  const pa = v => v == null ? "-" : Math.floor(v * 100 + 1e-9) + "%"; // % da meta sem arredondar para cima
  const T = R.tot, multi = stores.length > 1;
  const L = [];
  L.push(`*Casa Bauducco · Semana ${wi + 1} (${p2(R.w.from)} a ${p2(R.w.to)}/${mm})*`);
  if (R.last && R.last < R.w.to) L.push(`_Vendas até ${p2(R.last)}/${mm}_`);
  L.push("");
  L.push(`${dot(T.att)} *${multi ? "REDE" : shortStore(stores[0]).toUpperCase()}*`);
  L.push(`💰 Faturamento: ${k(T.v)} · ${pa(T.att)} da meta · projeção ${pa(T.g ? T.proj / T.g : null)}`);
  L.push(`🧾 Tickets: ${(T.t || 0).toLocaleString("pt-BR")} · Ticket médio: R$ ${tm(T.tm)}${T.tmG ? ` (meta R$ ${tm(T.tmG)})` : ""}`);
  L.push(`⭐ NPS: ${T.nps == null ? "-" : Math.round(T.nps)} · Avaliações: ${T.cnt} de ${Math.round(T.cntG)}`);
  L.push(`💳 Vendas fidelizadas: ${pc(T.fid, 1)} (meta ${pc(T.fidG)})`);
  if (multi) {
    L.push("");
    R.rows.slice().sort((a, b) => (b.att ?? 0) - (a.att ?? 0)).forEach(r => {
      L.push(`${dot(r.att)} *${shortStore(r.s).replace(" Shopping", "")}*`);
      L.push(`Faturamento: ${k(r.v)} · ${pa(r.att)} da meta`);
      L.push(`Ticket médio: R$ ${tm(r.tm)}${r.tmG ? ` (meta R$ ${tm(r.tmG)})` : ""}`);
      L.push(`NPS: ${r.nps == null ? "-" : Math.round(r.nps)} · Avaliações: ${r.cnt}`);
      L.push(`Vendas fidelizadas: ${pc(r.fid, 1)}`);
      L.push("");
    });
    L.push("_% da meta = faturamento vs meta dos dias vendidos_");
  }
  return L.join("\n");
}

/* =========================================================
   Metas semanais (Meta, Ouro, Diamante) e prêmios
   ========================================================= */
function weekResult(ym, st, w) {
  let v = 0, has = false;
  for (let d = w.from; d <= w.to; d++) { const t = dayTotal(dateOf(ym, d), [st]); if (t) { v += t.v; has = true; } }
  return { v, has };
}
function currentWeekIdx(ym, weeks) {
  let last = lastDataDay(ym);
  if (!last) last = TODAY_ISO.startsWith(ym) ? Number(TODAY_ISO.slice(8)) : 1;
  const i = weeks.findIndex(w => last >= w.from && last <= w.to);
  return i < 0 ? weeks.length - 1 : i;
}

// Semanas do mês: as do plano de metas; sem plano, blocos de 7 dias a partir do dia 1 (a última vai até o fim do mês).
function monthWeeks(ym) {
  const p = Object.values(S.plans?.[ym] || {})[0];
  if (p) return p.weeks.map(w => ({ from: w.from, to: w.to }));
  const dim = daysInMonth(ym);
  return [[1, 7], [8, 14], [15, 21], [22, dim]].map(([from, to]) => ({ from, to }));
}
function weekTcTm(ym, stores, w) {
  let v = 0, t = 0, n = 0;
  for (let d = w.from; d <= w.to; d++) { const x = dayTotal(dateOf(ym, d), stores); if (x) { v += x.v; t += x.t; n++; } }
  return { v, t, n, tcDay: n ? t / n : 0, tm: t ? v / t : 0, vDay: n ? v / n : 0 };
}
function varCell(cur, prev, fmt) {
  if (!cur) return `<span class="text-stone-300">—</span>`;
  const d = prev ? cur / prev - 1 : null;
  return `<span class="font-extrabold">${fmt(cur)}</span>${d === null ? "" : `<span class="block text-[11px] font-bold ${d >= 0 ? "text-emerald-700" : "text-rose-700"}">${d >= 0 ? "▲" : "▼"} ${pct(Math.abs(d), 1)}</span>`}`;
}
let tcView = "tc";
function tcTmSection(ym) {
  const weeks = monthWeeks(ym);
  const stores = selStores();
  const fmtTc = x => x.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
  const tot = weeks.map(w => weekTcTm(ym, stores, w));
  if (!tot.some(x => x.t)) return "";
  const label = w => `S${weeks.indexOf(w) + 1}`;
  const perStore = isBoard() && !S.view.store ? STORES.map(s => ({ s, ws: weeks.map(w => weekTcTm(ym, [s], w)) })) : [];
  const metric = { tc: ["TC por dia", x => x.tcDay, fmtTc], tm: ["TM", x => x.tm, money2], v: ["Venda por dia", x => x.vDay, x => money(x)] }[tcView];
  return `
    <div class="card p-4 space-y-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div><h2 class="font-extrabold">TC e TM por semana</h2><p class="text-[11px] text-stone-500">TC = número de vendas (cupons). TM = ticket médio. As setas comparam com a semana anterior.</p></div>
      </div>
      <div class="overflow-x-auto -mx-4">
        <table class="w-full text-sm tabular min-w-[520px]">
          <thead><tr class="text-[11px] uppercase tracking-wide text-stone-500 border-b border-cb-line">
            <th class="text-left px-4 py-2 font-bold">Semana</th><th class="text-right px-2 py-2 font-bold">Dias</th><th class="text-right px-2 py-2 font-bold">TC</th><th class="text-right px-2 py-2 font-bold">TC por dia</th><th class="text-right px-2 py-2 font-bold">TM</th><th class="text-right px-4 py-2 font-bold">Faturamento</th>
          </tr></thead>
          <tbody class="divide-y divide-cb-line">
            ${weeks.map((w, i) => { const x = tot[i], p = tot[i - 1]; return `<tr class="align-top">
              <td class="px-4 py-2.5"><p class="font-bold">Semana ${i + 1}</p><p class="text-[11px] text-stone-500">${w.from} a ${w.to}/${ym.slice(5)}</p></td>
              <td class="text-right px-2 py-2.5">${x.n || "—"}${x.n && x.n < w.to - w.from + 1 ? `<span class="block text-[10px] text-stone-400">de ${w.to - w.from + 1}</span>` : ""}</td>
              <td class="text-right px-2 py-2.5 font-semibold">${x.t ? intf(x.t) : "—"}</td>
              <td class="text-right px-2 py-2.5">${varCell(x.tcDay, p?.tcDay, fmtTc)}</td>
              <td class="text-right px-2 py-2.5">${varCell(x.tm, p?.tm, money2)}</td>
              <td class="text-right px-4 py-2.5">${varCell(x.v, null, v => money(v))}</td></tr>`; }).join("")}
          </tbody>
        </table>
      </div>
      <p class="text-[11px] text-stone-500">Como as semanas têm tamanhos diferentes (a 4ª vai de 22 a 30), a comparação de TC usa a média por dia.</p>
      ${perStore.length ? `
      <div class="space-y-2 pt-1">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <h3 class="text-sm font-extrabold">Por loja</h3>
          <div class="seg !p-0.5">${[["tc", "TC/dia"], ["tm", "TM"], ["v", "Venda/dia"]].map(([k, l]) => `<button onclick="tcView='${k}'; renderHome()" class="seg-btn !h-8 !text-xs ${tcView === k ? "seg-btn-active" : ""}">${l}</button>`).join("")}</div>
        </div>
        <div class="overflow-x-auto -mx-4">
          <table class="w-full text-sm tabular min-w-[520px]">
            <thead><tr class="text-[11px] uppercase tracking-wide text-stone-500 border-b border-cb-line"><th class="text-left px-4 py-2 font-bold">Loja</th>${weeks.map(w => `<th class="text-right px-2 py-2 font-bold">${label(w)}</th>`).join("")}<th class="text-right px-4 py-2 font-bold">S1 → última</th></tr></thead>
            <tbody class="divide-y divide-cb-line">
              ${perStore.map(({ s, ws }) => { const vals = ws.map(metric[1]); const lastI = vals.map((v, i) => v ? i : -1).filter(i => i >= 0).pop(); const ev = lastI > 0 && vals[0] ? vals[lastI] / vals[0] - 1 : null; return `<tr class="align-top">
                <td class="px-4 py-2.5 font-bold">${esc(shortStore(s))}</td>
                ${vals.map((v, i) => `<td class="text-right px-2 py-2.5">${varCell(v, vals[i - 1], metric[2])}</td>`).join("")}
                <td class="text-right px-4 py-2.5 font-extrabold ${ev === null ? "" : ev >= 0 ? "text-emerald-700" : "text-rose-700"}">${ev === null ? "—" : `${ev >= 0 ? "+" : ""}${pct(ev, 1)}`}</td></tr>`; }).join("")}
            </tbody>
          </table>
        </div>
      </div>` : ""}
    </div>`;
}

function weeksSection(ym, stMonth) {
  const stores = selStores();
  if (stores.some(s => !planOf(ym, s))) return "";
  if (stores.length === 1) {
    const s = stores[0], p = planOf(ym, s), cur = currentWeekIdx(ym, p.weeks), last = lastDataDay(ym) || (TODAY_ISO.startsWith(ym) ? Number(TODAY_ISO.slice(8)) - 1 : 0);
    let prizeTotal = 0;
    const rows = p.weeks.map((w, i) => {
      const r = weekResult(ym, s, w);
      const done = last >= w.to;
      const lvl = tierOf(r.v, w);
      if (done && lvl) prizeTotal += p.prizes[lvl];
      return { w, i, r, lvl, done };
    });
    const c = rows[cur];
    const nk = TIERS.find(([k]) => c.w[k] && c.r.v < c.w[k]);
    const next = nk ? [nk[1], c.w[nk[0]]] : null;
    const daysLeft = Math.max(0, c.w.to - last);
    return `
    <div class="card p-4 space-y-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <h2 class="font-extrabold">Semanas e prêmios</h2>
        <span class="text-xs text-stone-500">Prêmio por semana: Meta ${money(p.prizes.meta)}${p.weeks.some(w => w.ouro) ? `, Ouro ${money(p.prizes.ouro)}, Diamante ${money(p.prizes.diamante)}` : ""}</span>
      </div>
      ${!c.done ? `
      <div class="rounded-xl bg-cb-cream p-4 space-y-3">
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div><p class="text-xs font-bold text-stone-500 uppercase tracking-wider">Semana ${cur + 1} em andamento (${c.w.from} a ${c.w.to}/${ym.slice(5)})</p>
          <p class="text-2xl font-extrabold tabular">${money(c.r.v)}</p>
          <p class="text-sm text-stone-600">${next ? `Faltam <b>${money(next[1] - c.r.v)}</b> para ${next[0]}${daysLeft ? ` em ${daysLeft} dia(s)` : ""}` : c.w.diamante ? "Diamante garantido na semana!" : "Meta da semana batida!"}</p></div>
          ${c.lvl ? tierChip(c.lvl) : `<span class="chip bg-sky-100 text-sky-900">Em andamento</span>`}
        </div>
        ${goalBar({ v: c.r.v, goal: c.w.meta, projPct: c.r.v / c.w.meta, pctGoal: c.r.v / c.w.meta, last: 1, dim: 1 }, c.w)}
      </div>` : ""}
      <div class="overflow-x-auto -mx-4">
        <table class="w-full text-sm tabular min-w-[520px]">
          <thead><tr class="text-[11px] uppercase tracking-wide text-stone-500 border-b border-cb-line">
            <th class="text-left px-4 py-2 font-bold">Semana</th><th class="text-right px-2 py-2 font-bold">Realizado</th><th class="text-right px-2 py-2 font-bold">Meta</th><th class="text-right px-2 py-2 font-bold">Ouro</th><th class="text-right px-2 py-2 font-bold">Diamante</th><th class="text-right px-4 py-2 font-bold">Resultado</th>
          </tr></thead>
          <tbody class="divide-y divide-cb-line">
            ${rows.map(({ w, i, r, lvl, done }) => `<tr class="${i === cur && !done ? "bg-cb-cream/60" : ""}">
              <td class="px-4 py-2.5"><p class="font-bold">Semana ${i + 1}</p><p class="text-[11px] text-stone-500">${w.from} a ${w.to}/${ym.slice(5)}</p></td>
              <td class="text-right px-2 font-extrabold">${r.has ? money(r.v) : "—"}</td>
              ${TIERS.map(([k]) => `<td class="text-right px-2 ${w[k] && r.v >= w[k] ? "font-bold text-emerald-700" : "text-stone-500"}">${w[k] ? money(w[k], true) : "—"}</td>`).join("")}
              <td class="text-right px-4">${!r.has ? `<span class="text-[11px] text-stone-400">a começar</span>` : done ? `${tierChip(lvl)}${lvl ? `<p class="text-[11px] font-bold text-emerald-700 mt-0.5">prêmio ${money(p.prizes[lvl])}</p>` : ""}` : `<span class="chip bg-sky-100 text-sky-900">Em andamento</span>`}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <p class="text-sm"><b>Prêmios conquistados no mês:</b> ${money(prizeTotal)}${rows.some(r => !r.done) ? " (semanas fechadas)" : ""}</p>
    </div>`;
  }
  // Todas as lojas: semana atual de cada uma
  const p0 = planOf(ym, stores[0]);
  const cur = currentWeekIdx(ym, p0.weeks), w0 = p0.weeks[cur];
  const done = lastDataDay(ym) >= w0.to;

    <div class="card p-4 space-y-3">
      <div class="flex items-center justify-between gap-2 flex-wrap">

      <div class="divide-y divide-cb-line">
        ${stores.map(s => { const p = planOf(ym, s), w = p.weeks[cur], r = weekResult(ym, s, w), lvl = tierOf(r.v, w); return `

}
